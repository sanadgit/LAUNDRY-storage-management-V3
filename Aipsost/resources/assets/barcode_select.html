<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <!-- Meta, title, CSS, favicons, etc. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0 viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Aipsoft Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jquery-confirm.min.css">
    <script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
    <script src="js/jquery-confirm.min.js"></script>
    <script type="text/javascript">
    let api_user_id  = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
     let branch_id           = window.localStorage.getItem('branch_id');
    let branch_from        = window.localStorage.getItem('request_from')?window.localStorage.getItem('request_from'):0;
    let branch_to         = window.localStorage.getItem('request_to')?window.localStorage.getItem('request_to'):0;

    let request_id        = window.localStorage.getItem('request_id');
    if((api_user_id == null || api_user_id == '')) {
            window.location = "login.html";
    }else{
        $(document).ready(function() {
            //loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadItemRequestData',
                method: 'POST',
                data: {'client_identifier':client_identifier, 'api_user_id':api_user_id, 'branch_id':branch_id, 'request_id':request_id},
                success: function(response) {
                    //removeAjaxLoad();
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        let orderData  = data.data;
                        if(orderData.data_count > 0)
                        {
                            
                            window.location = "item_request.html";

                        }
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                       // removeAjaxLoad();
                        $.alert('No vendor found..!');
                        return false;                          
                    }   
            });
        })
    }
    
    </script>
</head>

<style type="text/css">

    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
    }
    .nav_deader {
        background-image: linear-gradient(to right, #305daf , #17a9ca);
        /*background-image: linear-gradient(#252525, #070707);*/
        padding: 8px;
        color: #fff;
        overflow: hidden;
    }
    .aiplogo {
        float: left;
        margin-right: 8px;
    }
    .nav_text p {
        font-size: 14px;
        margin: 0;
        font-weight: 400;
        margin-top: 2px;
    }
    .barcode_seect_wrap {
        padding: 20px;
    }    
    .home_wrap {
        padding: 12px 0;
    }
    .home_wrap button {
        background-color: #707070;
        border-radius: 4px;
        padding: 10px;
        margin-bottom: 8px;
        width: 100%;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
    }
    .footer button{
        width: 100%;
        padding: 15px;
        font-weight: 600;
        font-size: 16px;
        background-color: #2451a6;
        color: #fff;
        position: fixed;
        bottom: 0px;
        border: 0;
    }

    .home_wrap{
        text-align: center;;
    }
    .loading{
        text-align: center;
    }
    .barcode_seect_wrap p {
        text-align: left;
        margin: 0;
        padding-bottom: 8px;
        font-size: 14px;
    }
    .barcode_seect_wrap select {
        padding: 10px;
        width: 100%;
        border: 1px solid #989898;
        border-radius: 5px;
        color: #000;
    }

    /* CSS specific to iOS devices */ 

    @supports (-webkit-touch-callout: none) {
    .nav_deader {
        padding-top: 50px;
    }
    .barcode_seect_wrap {
        height:    calc(100vh - 90px);
    } 
    }



</style>

<body>

    <div class="nav_deader">
        <div class="aiplogo">
            <img src="images/aipsoft.png">
        </div>
        <div class="nav_text">
            <p>AipSoft - Login</p>
        </div>
    </div>

    <div class="barcode_seect_wrap">
        <div class="home_wrap">
            <p class="form_label">Request From</p>
             <select name="branches"  class="form-control request_from">
                
            </select>      
        </div>
        <div class="home_wrap">
            <p class="form_label">Request To</p>
             <select name="branches"  class="form-control request_to">
                
            </select>      
        </div>
    </div>
    <div class="footer">
        <button type="button" class="save_btn">Save & Continue</button>        
    </div>
<script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
<script>
     function loadAjax()
    {
        $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
        // $('.loading').removeClass('invisibl');
    }
    function removeAjaxLoad()
    {
        $('.loading').remove();
        // setTimeout(function(){ $('.loading').remove();},100);
    }
function getBarcodes()
{
    $.ajax({
                url: api_url+'/purchase_api/loadBranches',
                method: 'POST',
                dataType : "JSON",
                data: {'client_identifier':client_identifier, 'api_user_id':api_user_id, 'type': 'item_request'},
                success: function(response) {
                   console.log(response)
                   let br_html  =  `<option val="">Select Branch</option>`;
                   let br_from_html  =  `<option val="">Select Branch</option>`;

                   let prevent_depot_status = response.prevent_depot_status;


                    response.data.forEach(function(br, index) 
                    {
                      br_html +=  `<option value="${br.id}">${br.city}</option>`;

                      if (prevent_depot_status == '1') {

                        if (br.id == branch_id)
                            br_from_html +=  `<option value="${br.id}">${br.city}</option>`;
                      }else{
                        br_from_html +=  `<option value="${br.id}">${br.city}</option>`;
                      }
                      

                    });
                    $('.request_from').html(br_from_html);
                    $('.request_to').html(br_html);

                    $('.request_from').val(branch_from).change();
                    $('.request_to').val(branch_to).change();
                },
                error:function (xhr, ajaxOptions, thrownError){
                       // removeAjaxLoad();
                        $.alert('No vendor found..!');
                        return false;                          
                    }   
            });
}
$(document).ready(function() {
    
    getBarcodes();

    $(document).on('click','.save_btn',function(e){
    let branch_id             = window.localStorage.getItem('branch_id');
    let currency_id           = window.localStorage.getItem('currency_id');
    let request_from = $('.request_from').find(':selected').val();
    let request_to = $('.request_to').find(':selected').val();
    let flag = true;
    if(flag == true)
    {
        $('.save_btn').attr('disabled', 'disabled');
        loadAjax();
        $.ajax({
                url: api_url+'/purchase_api/startItemRequestProcess',
                method: 'POST',
                data: {'user_id':api_user_id,'branch_id': branch_id,'currency_id': currency_id,'client_identifier':client_identifier, 'request_from':request_from, 'request_to': request_to},
                success: function(response) {
                    $('.startBtn').removeAttr("disabled");
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        window.localStorage.setItem('request_id',data.request_id);
                        window.localStorage.setItem('request_from', request_from);
                         window.localStorage.setItem('request_to', request_to);
                         window.location = "item_request.html";
                    }
                    else
                    {
                        removeAjaxLoad();
                        $.alert(data.message);
                        return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $('.startBtn').removeAttr("disabled");
                        $.alert('Server error.Please Contact Aipsoft Support!');
                        return false;                          
                    }   
        });
    }
})
})
</script>
</body>

</html>
