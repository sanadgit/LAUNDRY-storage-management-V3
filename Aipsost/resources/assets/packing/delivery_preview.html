<script >$(document).ready(function() {
  var bodyEl = $('body'),
    accordionDT = $('.accordion').find('dt'),
    accordionDD = accordionDT.next('dd'),
    parentHeight = accordionDD.height(),
    childHeight = accordionDD.children('.content').outerHeight(true),
    newHeight = parentHeight > 0 ? 0 : childHeight,
    accordionPanel = $('.accordion-panel'),
    buttonsWrapper = accordionPanel.find('.buttons-wrapper'),
    openBtn = accordionPanel.find('.open-btn'),
    closeBtn = accordionPanel.find('.close-btn');

  bodyEl.on('click', function(argument) {
    var totalItems = $('.accordion').children('dt').length;
    var totalItemsOpen = $('.accordion').children('dt.is-open').length;

    if (totalItems == totalItemsOpen) {
      openBtn.addClass('hidden');
      closeBtn.removeClass('hidden');
      buttonsWrapper.addClass('is-open');
      //accordionDD.addClass('isActive');
      //accordionDD.css('overflow','visible');
      setTimeout(function(){accordionDD.css('overflow','visible');},500)
    } else {
      openBtn.removeClass('hidden');
      closeBtn.addClass('hidden');
      buttonsWrapper.removeClass('is-open');
      //accordionDD.removeClass('isActive');

      accordionDD.css('overflow','hidden');
    }
  });

      function openAll() {

        openBtn.on('click', function(argument) {

          accordionDD.each(function(argument) {
            var eachNewHeight = $(this).children('.content').outerHeight(true);
            $(this).css({
              height: eachNewHeight
            });
          });
          accordionDT.addClass('is-open');
        });
      }

      function closeAll() {

        closeBtn.on('click', function(argument) {
          accordionDD.css({
            height: 0
          });
          accordionDT.removeClass('is-open');
        });
      }

      function openCloseItem() {
        accordionDT.on('click', function() {

          var el = $(this),
            target = el.next('dd'),
            parentHeight = target.height(),
            childHeight = target.children('.content').outerHeight(true),
            newHeight = parentHeight > 0 ? 0 : childHeight;

          // animate to new height
          target.css({
            height: newHeight
          });

          // remove existing classes & add class to clicked target
          if (!el.hasClass('is-open')) {
            el.addClass('is-open');
          }

          // if we are on clicked target then remove the class
          else {
            el.removeClass('is-open');
          }
        });
      }

      openAll();
      closeAll();
      openCloseItem();

      let send_sms = window.localStorage.getItem('send_sms');
      let send_whatsapp = window.localStorage.getItem('send_whatsapp');
      if(send_sms != null && send_sms == 1)
      {
        $(".send_sms input[type='checkbox']").attr('checked', true);
      }
      if(send_whatsapp != null && send_whatsapp == 1)
      {
       $(".send_whatsapp input[type='checkbox']").attr('checked', true);
      }


    });
    //# sourceURL=pen.js
</script>

    <script type="text/javascript">

        // reference from https://www.digitalocean.com/community/tutorials/js-tabs

        const tabs = document.querySelectorAll(".tab");

        function tabify(tab) {
          const tabList = tab.querySelector(".tab__list");

          if (tabList) {
            const tabItems = [...tabList.children];
            const tabContent = tab.querySelector(".tab__content");
            const tabContentItems = [...tabContent.children];
            let tabIndex = 0;

            tabIndex = tabItems.findIndex((item, index) => {
              return [...item.classList].indexOf("is--active") > -1;
            });

            tabIndex > -1 ? (tabIndex = tabIndex) : (tabIndex = 0);

            function setTab(index) {
              tabItems.forEach((x, index) => x.classList.remove("is--active"));
              tabContentItems.forEach((x, index) => x.classList.remove("is--active"));

              tabItems[index].classList.add("is--active");
              tabContentItems[index].classList.add("is--active");
            }

            tabItems.forEach((x, index) =>
              x.addEventListener("click", () => setTab(index))
            );
            setTab(tabIndex);
            tab.querySelectorAll(".tab").forEach((tabContent) => tabify(tabContent));
          }
        }

        tabs.forEach(tabify);

        $('body').on('click','.next_block',function(){
            let final_packed_product_list    = [];
              let item_arr = [];
              $(".splitted_item_tr").each(function(){
                let each_db_id = $(this).data('db_id');
                if(jQuery.inArray(each_db_id,item_arr )==-1)
                {
                  item_arr.push(each_db_id);
                  let qty             = $(this).find('.pack_qty').text();
                  final_packed_product_list.push({'item_db_id':each_db_id,'pack_qty':qty});
                }
              });
              if(final_packed_product_list.length == 0)
              { 
                loadErrorPopup('Empty Prompt','Add atleast an item for packing to continue !')
                return false;
              }
            $('.tab__item[data-section="packing_footer"]').trigger('click')
        })
        $('body').on('click','.sec_back_btn',function(){
            $('.tab__item[data-section="order_footer"]').trigger('click')
        })
        $('body').on('click','.tab__item',function(){
            let section = $(this).data('section');

            $('.'+section).show();
            setTimeout(function(){ $('.remark_scan_input').focus();},150);

{

if(exist_str != '')
{

}

}
