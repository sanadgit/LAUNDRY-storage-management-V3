<script >$(document).ready(function() {

  var bodyEl = $('body'),
    accordionDT = $('.accordion').find('dt'),
    accordionDD = accordionDT.next('dd'),
    parentHeight = accordionDD.height(),
    childHeight = accordionDD.children('.content').outerHeight(true),
    newHeight = parentHeight > 0 ? 0 : childHeight,
    accordionPanel = $('.accordion-panel'),
    buttonsWrapper = accordionPanel.find('.buttons-wrapper'),
    openBtn = accordionPanel.find('.open-btn'),
    closeBtn = accordionPanel.find('.close-btn');

  bodyEl.on('click', function(argument) {
    var totalItems = $('.accordion').children('dt').length;
    var totalItemsOpen = $('.accordion').children('dt.is-open').length;

    if (totalItems == totalItemsOpen) {
      openBtn.addClass('hidden');
      closeBtn.removeClass('hidden');
      buttonsWrapper.addClass('is-open');
      //accordionDD.addClass('isActive');
      //accordionDD.css('overflow','visible');
      setTimeout(function(){accordionDD.css('overflow','visible');},500)
    } else {
      openBtn.removeClass('hidden');
      closeBtn.addClass('hidden');
      buttonsWrapper.removeClass('is-open');
      //accordionDD.removeClass('isActive');

      accordionDD.css('overflow','hidden');
    }
  });

      function openAll() {

        openBtn.on('click', function(argument) {

          accordionDD.each(function(argument) {
            var eachNewHeight = $(this).children('.content').outerHeight(true);
            $(this).css({
              height: eachNewHeight
            });
          });
          accordionDT.addClass('is-open');
        });
      }

      function closeAll() {

        closeBtn.on('click', function(argument) {
          accordionDD.css({
            height: 0
          });
          accordionDT.removeClass('is-open');
        });
      }

      function openCloseItem() {
        accordionDT.on('click', function() {

          var el = $(this),
            target = el.next('dd'),
            parentHeight = target.height(),
            childHeight = target.children('.content').outerHeight(true),
            newHeight = parentHeight > 0 ? 0 : childHeight;

          // animate to new height
          target.css({
            height: newHeight
          });

          // remove existing classes & add class to clicked target
          if (!el.hasClass('is-open')) {
            el.addClass('is-open');
          }

          // if we are on clicked target then remove the class
          else {
            el.removeClass('is-open');
          }
        });
      }

      openAll();
      closeAll();
      openCloseItem();
    });
$("body").on('click','.removeBtn',function(){
    let packing_id = window.localStorage.getItem('current_packing_id');
    if(packing_id!=undefined && packing_id!='')
    {
        $.confirm({
              title: '<b>Aipsoft Prompt</b>',
              content: '<label>Are You Sure to Remove this Packing?</label>',
              boxWidth: '35%',
              buttons: {
                  ok:{
                    text: 'Yes, Remove it !',
                    btnClass: 'btn-blue qty_ok',
                      action: function () {
                          deletePacking(packing_id);
                      }
                  },
                  cancel: {
                    action: function (cancel) {
                    },
                    text: 'No, Cancel'
                      //close
                  },
              },
              onContentReady: function () {
                  // bind to events
                  var jc = this;
                  this.$content.find('.split_qty_input').on('keyup', function (e) {
                    let val = $(this).val();
                    if(e.which == 13  || e.keyCode == 13)
                    {
                      if(!isNaN(val))
                        jc.$$ok.trigger('click');
                    }
                  }); 
            }
          });
    }
})
function deletePacking(packing_id)
{
    $.ajax({
        url      : base_url+"/"+client_identifier+"/packing_api/deletePacking",
        type     : "POST",
        data     : {'client_identifier': client_identifier,'packing_id': packing_id,'user_id':user_id},
        dataType : "JSON",
        success: function(data) 
        {
          removeAjaxLoad();
          $('.valid_input').val('');
          if(data.status==1)
          {
            window.localStorage.setItem('current_packing_id','');
              $.confirm({
                  title: 'Process Successful',
                  content: 'Your packing removed successfully.',
                  boxWidth: '50%',
                  useBootstrap: false,
                  icon: 'fas fa-exclamation-triangle',
                  backgroundDismissAnimation: 'glow',
                  type: 'green',
                  buttons: {
                      redirectUser: {
                          text: 'OK',
                          action: function () {
                              window.location.replace(`landing.html`);
                          }
                      }
                  }
              });
          }
        },
        error:function(request, status, error)
        {
          removeAjaxLoad();
          loadErrorPopup('Error in Process','Something went wrong, Please try again')
          return false;
        }
    });
}
