     /* Absolute Center Spinner */
.loading {
  position: fixed;
  z-index: 999;
  height: 2em;
  width: 2em;
  overflow: show;
  margin: auto;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
}

/* Transparent Overlay */
.loading:before {
  content: '';
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
    background: radial-gradient(rgba(20, 20, 20,.7), rgba(0, 0, 0, .7));

  background: -webkit-radial-gradient(rgba(20, 20, 20,.7), rgba(0, 0, 0,.7));
}

/* :not(:required) hides these rules from IE9 and below */
.loading:not(:required) {
  /* hide "loading..." text */
  font: 0/0 a;
  color: transparent;
  text-shadow: none;
  background-color: transparent;
  border: 0;
}

.loading:not(:required):after {
  content: '';
  display: block;
  font-size: 10px;
  width: 1em;
  height: 1em;
  margin-top: -0.5em;
  -webkit-animation: spinner 150ms infinite linear;
  -moz-animation: spinner 150ms infinite linear;
  -ms-animation: spinner 150ms infinite linear;
  -o-animation: spinner 150ms infinite linear;
  animation: spinner 150ms infinite linear;
  border-radius: 0.5em;
  -webkit-box-shadow: rgba(255,255,255, 0.75) 1.5em 0 0 0, rgba(255,255,255, 0.75) 1.1em 1.1em 0 0, rgba(255,255,255, 0.75) 0 1.5em 0 0, rgba(255,255,255, 0.75) -1.1em 1.1em 0 0, rgba(255,255,255, 0.75) -1.5em 0 0 0, rgba(255,255,255, 0.75) -1.1em -1.1em 0 0, rgba(255,255,255, 0.75) 0 -1.5em 0 0, rgba(255,255,255, 0.75) 1.1em -1.1em 0 0;
box-shadow: rgba(255,255,255, 0.75) 1.5em 0 0 0, rgba(255,255,255, 0.75) 1.1em 1.1em 0 0, rgba(255,255,255, 0.75) 0 1.5em 0 0, rgba(255,255,255, 0.75) -1.1em 1.1em 0 0, rgba(255,255,255, 0.75) -1.5em 0 0 0, rgba(255,255,255, 0.75) -1.1em -1.1em 0 0, rgba(255,255,255, 0.75) 0 -1.5em 0 0, rgba(255,255,255, 0.75) 1.1em -1.1em 0 0;
}

/* Animation */

@-webkit-keyframes spinner {
  0% {
    -webkit-transform: rotate(0deg);
    -moz-transform: rotate(0deg);
    -ms-transform: rotate(0deg);
    -o-transform: rotate(0deg);
    transform: rotate(0deg);
  }
  100% {
    -webkit-transform: rotate(360deg);
    -moz-transform: rotate(360deg);
    -ms-transform: rotate(360deg);
    -o-transform: rotate(360deg);
    transform: rotate(360deg);
  }
}
@-moz-keyframes spinner {
  0% {
    -webkit-transform: rotate(0deg);
    -moz-transform: rotate(0deg);
    -ms-transform: rotate(0deg);
    -o-transform: rotate(0deg);
    transform: rotate(0deg);
  }
  100% {
    -webkit-transform: rotate(360deg);
    -moz-transform: rotate(360deg);
    -ms-transform: rotate(360deg);
    -o-transform: rotate(360deg);
    transform: rotate(360deg);
  }
}
@-o-keyframes spinner {
  0% {
    -webkit-transform: rotate(0deg);
    -moz-transform: rotate(0deg);
    -ms-transform: rotate(0deg);
    -o-transform: rotate(0deg);
    transform: rotate(0deg);

    -moz-transform: rotate(360deg);

function bin2hex(str)
    {
        let i;
        let l;
        let output = '';
        let n;
        str += '';
        for (i = 0, l = str.length; i < l; i++)
        {
            n = str.charCodeAt(i).toString(16);
            output += n.length < 2 ? '0' + n : n;
        }
        return output;
    }
   
    function EncryptData(data,salt)
    {
        partial_result = salt+data+salt;           //Salt Added on both side of the Data
        partial_result = partial_result.split("").reverse().join("");
        partial_result = bin2hex(partial_result);  //Convert the reversed Data to Hexadecimal
        final_result   = partial_result.split("").reverse().join("");  //Reverse the Hexadecimal Data
        return final_result;
    }

                    data: {'username': api_user+'@'+company_id,'password':api_pwd},
                    beforeSend: function() {
                        $('.main_loader').removeClass('hidden');   
                    },
                    complete: function (request) {
                        $('.main_loader').addClass('hidden');   
                    },
                    success: function(response) {
                        $('.login_action').removeAttr("disabled");
                        var data =JSON.parse(response);
                        console.log(data);
                        if(data.status==1)
                        {
                           let successData = data.data;
                            window.localStorage.setItem('api_url',connectapiurl);
                            window.localStorage.setItem('api_user',api_user);
                            window.localStorage.setItem('api_pwd',api_pwd);
                            window.localStorage.setItem('api_user_id',successData.user_id);
                            window.localStorage.setItem('client_identifier',successData.oem_identifier);
                            window.localStorage.setItem('branch_id',successData.branch_id);
                            window.localStorage.setItem('currency_id',successData.currency_id);
                            window.localStorage.setItem('order_id',successData.pending_order);
                            window.localStorage.setItem('order_id_grv',successData.pending_order_grv);
                            window.localStorage.setItem('tax_included',successData.purchase_tax_included);
                            window.localStorage.setItem('client_id',company_id);
                            // if(successData.pending_order==0)
                            //     window.location = "landing.html";
                            // else
                            //     window.location = "grn_item.html";
                             window.location = "landing.html";
                        }
                        else
                        {
                             $.alert('Invalid Credentials..!, '+api_user+'@'+company_id);
                             return false;
                        }
                        
                        // if($('#scroll_container').height() > 610) {
                        //  $('.scroll_icon').css('display', 'block');
                        // }
                    },
                    error:function (xhr, ajaxOptions, thrownError){
                            $('.login_action').removeAttr("disabled");
                            if (xhr.status === 0 && xhr.statusText === 'error') {
                                $.alert('No connection established to '+connectapiurl+"<br><br>please check.!");
                            } else {
                                $.alert("<h2>Invalid Credentials..!</h2>Api:" + connectapiurl + "\nUser:" + api_user + '@' + company_id);
                                // $('.login_cont_div').hide();
                                // $('.api_url_cont').fadeIn();
                            }
                            return false;
                        }   

                });
}


    $(document).on('keyup','.form_element input',function(e){
        let val = $(this).val();
        if(val!='' && (e.which == 13  || e.keyCode == 13))
        {
            if($(this).parents('.form_element').next('.form_element').find('input').length > 0)
            {
                $(this).parents('.form_element').next('.form_element').find('input').select();
            }
            else
            {
                $('.login_action').click();
            }
        }
    })


</script>
