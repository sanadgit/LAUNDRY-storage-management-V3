<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <!-- Meta, title, CSS, favicons, etc. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aipsoft - Authentication</title>

    <!-- Google Fonts: Urbanist (Brand Guideline) -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Original Plugin CSS -->
    <link rel="stylesheet" href="css/jquery-confirm.min.css">

    <!-- Tailwind CSS for ultra-fast, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons for crisp, native-feeling vector icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration using Brand Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Urbanist', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0A0045',
                            purple: '#5334D1',
                            pink: '#C5299D',
                            light: '#8E80FF',
                            bg: '#050514' /* Deep dark background */
                        }
                    }
                }
            }
        }
    </script>

    <!-- Global Styling & Dynamic JS Injections Styling -->
    <style type="text/css">
        html, body {
            font-family: 'Urbanist', sans-serif;
            background-color: #050514;
            margin: 0;
            padding: 0;
            height: 100%;
            min-height: 100vh;
            overflow: hidden; /* Prevent whole page scroll */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none; /* Disable iOS callout menu (copy/paste/magnifier) */
            -webkit-user-select: none;   /* Disable text selection on iOS */
            user-select: none;
            color: #ffffff;
        }

        /* Safe area handling for notched iOS devices */
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }

        .invisibl { display: none !important; }

        /* Custom scrollbar for content area */
        .content_body::-webkit-scrollbar { display: none; }

        /* Loader Overlay Styling */
        .loader_gif {
            position: absolute;
            width: 60px; height: 60px;
            left: 50%; top: 60px;
            transform: translateX(-50%);
            z-index: 50;
            filter: drop-shadow(0 0 10px rgba(197,41,157,0.5));
        }

        /* ----------------------------------------------------
           Container for the dynamically injected list
           ---------------------------------------------------- */
        .auth_ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem; /* Reduced gap between cards */
        }

        /* Status Modifiers (Triggered by JS logic) */
        .auth_ul li.accepted {
            border-color: rgba(52, 211, 153, 0.5) !important;
            background: rgba(52, 211, 153, 0.1) !important;
        }
        .auth_ul li.rejected {
            border-color: rgba(248, 113, 113, 0.5) !important;
            background: rgba(248, 113, 113, 0.1) !important;
        }

        /* Disabled button state when accepted/rejected */
        .auth_ul li.accepted .approve, .auth_ul li.accepted .reject,
        .auth_ul li.rejected .approve, .auth_ul li.rejected .reject {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(1);
        }

        .auth_ul li.initial_fetch {
            text-align: center;
            color: rgba(255,255,255,0.5) !important;
            font-weight: 600;
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            margin-top: 2rem;
            padding: 0 !important;
        }

        /* Instant tap animation class for buttons */
        button {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .active-tap {
            transform: scale(0.94) !important;
            opacity: 0.85 !important;
        }
    </style>

    <!-- Original Initial Configuration Logic -->
    <script src="js/config.js"></script>
    <script type="text/javascript">
        let api_user_id         = window.localStorage.getItem('api_user_id');
        let api_url             = window.localStorage.getItem('api_url');
        let client_identifier   = window.localStorage.getItem('client_identifier');
        if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
                window.location = "login.html";
        }
    </script>

    <!-- Original Firebase Logic untouched -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.13.0/firebase-app.js";
        import { getDatabase , ref, set,get,child,update,remove,onValue,onChildAdded,onChildChanged,onChildRemoved,push} from "https://www.gstatic.com/firebasejs/9.13.0/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyDnoBuqlPQBqGr8Swfsc7Yz1_hVa3aK4_o",
            authDomain: "test-js-firebase-web-app-46686.firebaseapp.com",
            databaseURL: "https://test-js-firebase-web-app-46686-default-rtdb.firebaseio.com",
            projectId: "test-js-firebase-web-app-46686",
            storageBucket: "test-js-firebase-web-app-46686.appspot.com",
            messagingSenderId: "45134372216",
            appId: "1:45134372216:web:6ed15be4b6dd652820fc8d"
        };
        let user_type = 4;
        let client_identifier = window.localStorage.getItem('client_identifier');
        let branch_id         = window.localStorage.getItem('branch_id');
        let endpoint          = client_identifier+"/"+branch_id;
        let client_identifier_endpoint = client_identifier;
        let delete_endpoint   = client_identifier+"/"+branch_id+"/"+user_type;
        let user_type_ep      = endpoint+"/"+user_type;
        const app    = initializeApp(firebaseConfig);
        const db     = getDatabase();
        const db_ref = ref(db,client_identifier_endpoint);
        const db_ref_del = ref(db,delete_endpoint);
        let get_all_data = function()
        {
            let dbref = ref(db);
            let final_endpoint  = client_identifier+"/"+branch_id+"/"+user_type;
            get(child(dbref,final_endpoint)).then((snapshot)=>{
                if (!snapshot.exists())
                {
                    $(".loader_gif,.all_wrapper").addClass('invisibl');
                    $(".initial_fetch").text('No data Exists');

                }
                else
                {

                }
            });
        }
        get_all_data();
        let draw_data = function(datas)
        {
            console.log(datas);
            console.log('in draw data');
            datas = datas[user_type];
            if($(".initial_fetch").length > 0)$(".auth_ul").empty();
            $(".all_wrapper").removeClass('invisibl');
            $.each(datas,function(identifier,each_data){
                console.log(each_data['action_content']);
                if(each_data['action_content'] != undefined && each_data['action_content'] != "")
                {
                    let content  = JSON.parse(each_data['action_content']);
                    let status   = each_data['status'];
                    let action_content_html = '';
                    if(status == '0')
                    {
                        let sts_cls  = '';
                        let sts_text = '';
                        if(status == '1')
                        {
                            sts_cls  = 'accepted';
                            sts_text = 'Accepted';
                        }
                        if(status == '2')
                        {
                            sts_cls  = 'rejected';
                            sts_text = 'Rejected';
                        }
                        console.log(content);
                        if($('li[data-identifier="'+identifier+'"]').length == 0)
                        {
                             if(content != undefined && content != null)
                             {
                                // Added the `uppercase` class to the value span so the text is capitalized visually
                                $.each(content,function(key,ddata){
                                    action_content_html += '<div class="mb-1.5 pb-1.5 border-b border-white/5 last:border-0 last:mb-0 last:pb-0"><span class="text-brand-light font-bold uppercase text-[9px] tracking-wider block mb-0.5">'+convert_key_to_text(key,1)+':</span> <span class="text-white block font-semibold text-[13px] leading-tight uppercase">'+convert_key_to_text(ddata)+'</span></div>';
                                });
                             }
                             let data_branch_id = '';
                             if(content['branch'])
                                data_branch_id = content['branch'];

                            // Redesigned Injected Card Layout - Compact, Professional, Smaller Pads
                            $(".auth_ul").prepend(`<li data-branch_id="${data_branch_id}" data-identifier="${identifier}" class="${sts_cls} each_auth bg-white/5 border border-white/10 rounded-xl p-3.5 relative backdrop-blur-md shadow-md transition-all duration-300">

                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="text-white text-[14px] font-bold tracking-wide uppercase m-0 leading-tight truncate pr-2">${convert_key_to_text(each_data['action_head'],1)}</h3>

                                    <label class="flex items-center gap-1.5 text-white/70 font-semibold text-[9px] uppercase tracking-wider cursor-pointer shrink-0 bg-white/5 px-2 py-1 rounded border border-white/10 hover:bg-white/10 transition-colors">
                                        <input type="checkbox" name="select_order" class="select_order w-3.5 h-3.5 accent-brand-pink" />
                                        <span>Select</span>
                                    </label>
                                </div>

                                <div class="bg-black/30 border border-white/5 rounded-lg p-3 mb-3 shadow-inner">
                                    ${action_content_html}
                                </div>

                                <div class="flex gap-2 w-full">
                                    <button class="approve flex-1 bg-gradient-to-r from-brand-purple to-brand-pink text-white font-bold py-2 rounded-lg shadow-[0_2px_10px_-3px_rgba(197,41,157,0.4)] active:scale-95 transition-transform text-[11px] tracking-widest uppercase">
                                        APPROVE
                                    </button>
                                    <button class="reject flex-1 bg-red-500/10 border border-red-500/30 text-red-400 font-bold py-2 rounded-lg active:scale-95 transition-all hover:bg-red-500/20 text-[11px] tracking-widest uppercase" style="float: none;">
                                        REJECT
                                    </button>
                                    <button class="delete flex-1 bg-red-600 text-white font-bold py-2 rounded-lg active:scale-95 transition-transform text-[11px] hidden" style="display:none;">
                                        DELETE
                                    </button>
                                </div>
                            </li>`);
                        }
                    }
                }

            });
            $(".loader_gif").addClass('invisibl')
        }
        function convert_key_to_text(str,caps=0)
        {
            let string = str.replace(/[^a-zA-Z0-9 ]/g, " ");
            if(caps==1)
            return string.toUpperCase();
            else
            return string;
        }
        let update_status = function($li,identifier,status)
        {
            console.log({status});
            if(status == '1')$($li).addClass('approving');
            if(status == '2')$($li).addClass('rejecting');

            let sel_branch_id = $($li).data('branch_id');
            let update_ep     = client_identifier_endpoint +'/'+sel_branch_id+'/'+user_type;

            console.log(update_ep+"/"+identifier);
            let dbref = ref(db);
            get(child(dbref,update_ep+"/"+identifier)).then((snapshot)=>{
                if(snapshot.exists())
                {
                    update(ref(db,update_ep+"/"+identifier), {
                      status : status,
                      authorised_by:api_user_id,
                    })
                    .then(() => {
                        console.log('Update Completed');
                        if($("li.rejecting").length > 0)
                           $("li.rejecting").addClass('rejected').removeClass('rejecting').removeClass('accepted');
                        if($("li.approving").length > 0)
                           $("li.approving").addClass('accepted').removeClass('approving').removeClass('rejected');
                        $(".loader_gif").addClass('invisibl');
                    })
                    .catch((error) => {
                        console.log('Update Failed');
                        console.log(error);
                    });
                }
                else
                   $(".loader_gif").addClass('invisibl');
            });
        }
        let delete_data = function(identifier,$parent)
        {
            $(".loader_gif").removeClass('invisibl');
            let sel_branch_id = $($parent).data('branch_id');
            let del_ep = client_identifier_endpoint +'/'+sel_branch_id+'/'+user_type;
            console.log(identifier);
            console.log(del_ep+"/"+identifier);
            // remove(ref(db,user_type_ep+"/"+identifier));
            remove(ref(db,del_ep+"/"+identifier));
            rt_db_op_log(identifier,$($parent).find('p').text(),$($parent).find('h3').text(),'Deleted');
            $('li[data-identifier="'+identifier+'"]').remove();
            $(".loader_gif").addClass('invisibl');
        }
        let new_watcher = function()
        {
            onChildAdded(db_ref, (data) => {
                $(".loader_gif").removeClass('invisibl');
                console.log(client_identifier_endpoint);
            console.log(db_ref);
                console.log('child added man');
                console.log(data.val());
                draw_data(data.val());
            });
            onChildChanged(db_ref, (data) => {
                $(".loader_gif").removeClass('invisibl');
                console.log('child changed');
                // console.log(data.val());
                draw_data(data.val());
            });
            onChildRemoved(db_ref_del, (data) => {
                console.log('child removed');
                console.log(data.val());
                let removed_data = data.val();
                let identifier = removed_data['identifier'];
                console.log(identifier);
                $('li[data-identifier="'+identifier+'"]').remove();
            });

        }
        new_watcher();
        let check_empty = function()
        {
            console.log($(".auth_ul").find('li').length);
            if($(".auth_ul").find('li').length == 0)$(".all_wrapper").addClass('invisibl');
        }
        let rt_db_op_log = function(newPostKey,action_head,action_content,action)
        {
            $.ajax({
                url      : api_url + "/pos_api/rt_db_op_log",
                type     : "POST",
                dataType : "JSON",
                data     : {'client_identifier':client_identifier,'authorised_by':api_user_id,'branch_id':branch_id,'user_type_id':user_type,'identifier':newPostKey,'action_head':action_head,'action_content':action_content,'action':action},
                success  : function(data){
                    console.log(data);
                }
            });
        }
        $("body").on('click','.approve',function(){
            $(".loader_gif").removeClass('invisibl');
            let identifier = $(this).parents('li').data('identifier');
            update_status($(this).parents('li'),identifier,'1');
            let $parent_li = $(this).parents('li');
            rt_db_op_log(identifier,$(this).parents('li').find('p').text(),$(this).parents('li').find('h3').text(),'Approved');
            $(this).parents('li').animate({
                opacity: 0,
            }, 500, function() {
                console.log($parent_li);
                $parent_li.remove();
                console.log('clicked');
                check_empty();
            });
        });
        $("body").on('click','.reject',function(){
            $(".loader_gif").removeClass('invisibl');
            let identifier = $(this).parents('li').data('identifier');
            update_status($(this).parents('li'),identifier,'2');
            let $parent_li = $(this).parents('li');
            rt_db_op_log(identifier,$(this).parents('li').find('p').text(),$(this).parents('li').find('h3').text(),'Rejected');
            $(this).parents('li').animate({
                opacity: 0,
            }, 500, function() {
                console.log($parent_li);
                $parent_li.remove();
                console.log('clicked');
                check_empty();
            });
           console.log(identifier);
        });
        $("body").on('click','.select_all',function(){
            if($(this).prop('checked'))
                $(".select_order").attr('checked','checked');
            else
                $(".select_order").attr('checked',false);
        });
        $("body").on('click','.delete',function(){
            let identifier = $(this).parents('li').data('identifier');
            delete_data(identifier,$(this).parents('li'));
            check_empty();
        });
        $("body").on('click','.delete_selected',function(){
            let identifier = '';
            $(".select_order:checked").each(function(){
                identifier = $(this).parents('li').data('identifier');
                 console.log(identifier);
                delete_data(identifier,$(this).parents('li'));
            });
        });
    </script>
</head>

<body>
<!-- Mobile Wrapper (Locked to 100% viewport height with flex-col) -->
<div class="max-w-md mx-auto min-h-[100vh] w-full bg-brand-bg relative overflow-hidden flex flex-col">

    <!-- Abstract Glowing Gradients -->
    <div class="absolute top-[-10%] left-[-20%] w-96 h-96 bg-brand-purple rounded-full mix-blend-screen filter blur-[120px] opacity-30 pointer-events-none z-0"></div>
    <div class="absolute top-[30%] right-[-20%] w-80 h-80 bg-brand-pink rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] left-[10%] w-96 h-96 bg-brand-light rounded-full mix-blend-screen filter blur-[150px] opacity-20 pointer-events-none z-0"></div>

    <!-- App Header (Static shrink-0 so it perfectly stacks at top) -->
    <header class="w-full z-40 bg-brand-bg/80 backdrop-blur-xl border-b border-white/5 shadow-sm pt-safe nav_deader shrink-0">
        <div class="flex items-center px-4 py-3 h-16">
            <!-- Back Button -->
            <button class="back_btn flex items-center justify-center w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 active:bg-white/15 transition-colors border border-white/10 shrink-0">
                <i data-lucide="chevron-left" class="w-6 h-6 text-white"></i>
            </button>

            <!-- Title -->
            <h1 class="flex-1 text-center text-[17px] font-bold text-white mr-10 leading-tight">
                Authentication
            </h1>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <div class="GRN_wrap flex-1 flex flex-col min-h-0 pt-4 px-4 pb-safe relative z-10 w-full">

        <!-- Global Action Bar (Select All / Delete Selected) -->
        <div class="all_wrapper invisibl bg-white/5 backdrop-blur-md rounded-xl p-3 border border-white/10 mb-3 flex justify-between items-center shadow-md shrink-0">
            <label class="text-white flex items-center gap-2 font-medium text-[13px] cursor-pointer">
                <input type="checkbox" name="select_all" class="select_all w-4 h-4 accent-brand-pink">
                Select All
            </label>
            <button class="delete_selected bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors active:scale-95">
                Delete Selected
            </button>
        </div>

        <!-- Scrollable Auth Feed List -->
        <div class="content_body flex-1 overflow-y-auto w-full relative pb-10">
            <div class="loader_wrapper w-full relative h-0">
                <img class="loader_gif" src="images/loading-gif.gif">
            </div>

            <ul class="auth_ul">
                <li class="initial_fetch">Fetching Data.....</li>
            </ul>
        </div>

    </div>
</div>

<!-- Original Dependencies & Event Listeners untouched -->
<script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
<script src="js/jquery-confirm.min.js"></script>
<script>
    $(document).ready(function() {
        lucide.createIcons();

        $('.back_btn').click(function(){
            window.location = "home.html";
        });

        $('.settings').click(function(){
            let el = $(this);
            let settings = $(this).attr("data-settings")
            if(el.hasClass(settings))
            {
                window.localStorage.setItem(settings,el.val());
            }
        });

        var dataAttributes = {};
        $(".settings").each(function (index, el) {
            if ( ! ($(el).data('settings') in dataAttributes) ) dataAttributes[$(el).data('settings')] = [];
            dataAttributes[$(el).data('settings')].push( $(el).find('settings').attr("data-settings") );
        });

        $.each(dataAttributes, function(key, value) {
          let settings_key =  window.localStorage.getItem(key);
           if(settings_key != '' && settings_key != null)
           {
                console.log(settings_key);
                if(settings_key == 1)
                     $('.'+key+'.enable').attr('checked', 'checked');
                 else
                     $('.'+key+'.disable').attr('checked', 'checked');
           }
           else
           {
                $('.'+key+'.enable').attr('checked', 'checked');
           }

        });

        // --- INSTANT TOUCH FEEDBACK ---
        // iOS Safari delays the CSS :active state. This forces instant visual feedback on all buttons.
        $(document).on('touchstart', 'button', function() {
            $(this).addClass('active-tap');
        }).on('touchend touchmove touchcancel', 'button', function() {
            let $el = $(this);
            setTimeout(function() { $el.removeClass('active-tap'); }, 150);
        });

    })
</script>
</body>
</html>
