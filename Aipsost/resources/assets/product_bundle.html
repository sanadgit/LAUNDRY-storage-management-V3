    <script type="text/javascript">
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let branch_id           = window.localStorage.getItem('branch_id');
    let product_id           = window.localStorage.getItem('product_id');
    let barcode           = window.localStorage.getItem('barcode');
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    } 
    let bundle_id     = window.localStorage.getItem('bundle_id');
    if(bundle_id!=0 && bundle_id!=undefined && bundle_id!=null && bundle_id!='')
    {
        window.location = "product_bundle_item.html";
    }
    if(product_id!='' || product_id!=null || product_id!='0')
    {
        $(document).ready(function() {
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadProduct',
                method: 'POST',
                data: {'barcode': barcode,'branch_id':branch_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        let productData  = data.data;
                        proceedToAdd(productData,1);
                        
                    }
                    else
                    {
                         let productsList = '<p>No details found</p>';
                         $('.addressform').html('');
                         $.alert(data.message);
                         return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No product found..!');
                        return false;                          
                    }   
            });
        })
    }
    </script>

<script type="text/javascript">
function currentDate(){
    let date = new Date();
    let day = date.getDate();
    let month = date.getMonth() + 1;
    let year = date.getFullYear();

    if (month < 10) month = "0" + month;
    if (day < 10) day = "0" + day;

    let today = year + "-" + month + "-" + day;
    return today;
}
$(document).ready(function(){
    $('.back_btn').click(function(){
        window.localStorage.setItem('product_id','0');
        window.localStorage.setItem('barcode','');
        window.location = "products.html";
    })
    setTimeout(function(){
        let today = currentDate();
        $('.stock_count').select();
        $('.date').val(today);

    },100)
})  
$(document).on('keyup','.stock_count',function(e){
    let val = $(this).val();
    if((e.which == 13  || e.keyCode == 13))
    {
        $('.startBtn').click()
    }
})  
$(document).on('click','.startBtn',function(e){
    let branch_id             = window.localStorage.getItem('branch_id');
    let currency_id           = window.localStorage.getItem('currency_id');

    let unit_id                = $('.p_unit_id').attr('data-unit_id')?$('.p_unit_id').attr('data-unit_id'):'';
    let sale_price                = $('.p_sale_price').html()?$('.p_sale_price').html():'';
    let sale_price_with_tax                = $('.p_sale_price_with_tax').html()?$('.p_sale_price_with_tax').html():'';
    let date                = $('.date').val()?$('.date').val():"";
    let stock_count                = $('.stock_count').val()?$('.stock_count').val():0;
    let remark                = $('.remark').val()?$('.remark').val():'';
    let flag = true;
    console.log('product_id - '+product_id)

    $('.stock_count').removeClass('invalid');
    if (stock_count == 0){
        $('.stock_count').addClass('invalid');
        flag = false;
    }
    $('.date').removeClass('invalid');
    if (date == ""){
        $('.date').addClass('invalid');
        flag = false;
    }

    if(product_id!=null && product_id!='' && product_id!=0 && flag == true)
    {
        $('.startBtn').attr('disabled', 'disabled');
        loadAjax();
        $.ajax({
                url: api_url+'/purchase_api/startBundleProcess',
                method: 'POST',
                data: {
                    'user_id':api_user_id,
                    'product_id':product_id,
                    'branch_id': branch_id,
                    'currency_id': currency_id,
                    'client_identifier':client_identifier,
                    'unit_id':unit_id,
                    'sale_price':sale_price,
                    'sale_price_with_tax':sale_price_with_tax,
                    'date':date,
                    'stock_count':stock_count,
                    'remark':remark
                },
                success: function(response) {
                    $('.startBtn').removeAttr("disabled");
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        window.localStorage.setItem('bundle_id',data.bundle_id);
                        window.localStorage.setItem('product_id',product_id);
                        window.location = "product_bundle_item.html";
                    }
                    else
                    {
                        removeAjaxLoad();
                        window.localStorage.setItem('bundle_id','0');
                        window.localStorage.setItem('product_id','0');
                        $.alert(data.message);
                        return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $('.startBtn').removeAttr("disabled");
                        $.alert('Server error.Please Contact Aipsoft Support!');
                        return false;                          
                    }   
        });
    }
})
function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
    // $('.loading').removeClass('invisibl');
}
function removeAjaxLoad()
{
    $('.loading').remove();
    // setTimeout(function(){ $('.loading').remove();},100);
}
function proceedToAdd(productData,mode=0)
{
    let productsList = '';
    if(productData.data_count > 0)
    {
        let products = productData.data_result;

        productsList += `<p>Product Name : <span class="p_product_name">${products[0].product_name}</span></p>`;
        productsList += `<p class="imp">Barcode : <span class="p_barcode">${products[0].barcode}</span></p>`;
        productsList += `<p>Unit : <span class="p_unit_id" data-unit_id=${products[0].unit_id}>${products[0].avail_units}</span></p>`;
        productsList += `<p>Purchase Rate : <span class="p_purchase_rate">${products[0].purchase_rate}</span></p>`;
        productsList += `<p>Sale Price: <span class="p_sale_price">${products[0].rsp_with_tax}</span></p>`;
        productsList += `<p>Sale Price with Tax : <span class="p_sale_price_with_tax">${products[0].sale_price}</span></p>`
    }
    else
    {
        productsList = '<p>No details found</p>';
    }
    $('.addressform').html(productsList);
       
}
</script>
