<script>
$(document).ready(function() {
    $('.logout_btn').click(function(){
         window.localStorage.setItem('api_user_id','');
         window.location = "login.html";
    })
    $('.back_btn').click(function(){
        window.location = "home.html";
    })
    $('.keyword_search').focus(function(){
        $(this).select();
    })
})
$(document).on('keyup','.keyword_search',function(e){
    let val = $(this).val();
    if(val!='' && (e.which == 13  || e.keyCode == 13))
    {
        $('.searchIco').hide();
        $('.loadingIco').show();
        $.ajax({
                url: api_url+'/purchase_api/loadProducts',
                method: 'POST',
                data: {'keyword': val,'client_identifier':client_identifier},
                success: function(response) {
                    $('.loadingIco').hide();
                    $('.searchIco').show();
                    $('.keyword_search').select()
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        let productData  = data.data;
                        let productsList = '';
                        if(productData.data_count > 0)
                        {
                            let products = productData.data_result;
                            products.forEach(function(product, index) {
                                productsList += '<li class="item" data-id="'+product.id+'" data-barcode="'+product.barcode+'">'+product.barcode+' - '+product.product_name+'</li>';
                            })

                        }
                        else
                        {
                            productsList = '<li class="empty">No item found</li>';
                        }
                        $('.products_list').html(productsList);
                    }
                    else
                    {
                         let productsList = '<li class="empty">No item found</li>';
                         $('.products_list').html(productsList);
                         $.alert(data.message);
                         return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        $('.loadingIco').hide();
                        $('.searchIco').show();
                        $.alert('No product found..!');
                        return false;                          
                    }   
            });
    }
})
$(document).on('click','.products_list li.item',function(e){
    $('.products_list li.item').removeClass('active');
    $(this).addClass('active');
})
$(document).on('click','.startBtn',function(e){
    let product_id             = $('.products_list li.active').data('id');
    let barcode             = $('.products_list li.active').data('barcode');
    if(product_id!=null && product_id!='' && product_id!=0)
    {
       window.localStorage.setItem('product_id',product_id);
       window.localStorage.setItem('barcode',barcode);
       window.location = "product_bundle.html";
    }
})
</script>
