    <script type="text/javascript"> 
    
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let order_id            = window.localStorage.getItem('order_id');
    let vendor_id           = window.localStorage.getItem('vendor_id');
    let branch_id           = window.localStorage.getItem('branch_id');
    let currency_id         = window.localStorage.getItem('currency_id');
    let tax_included        = window.localStorage.getItem('tax_included');
    let expense_id          = window.localStorage.getItem('expense_id');
    let module_settings;
    let user_type;
    let expense_data;
    // console.log('tax_included - '+tax_included)
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
        window.location = "login.html";
    } 
    if(expense_id == '' || expense_id ==undefined || expense_id ==null || expense_id=='0') {
        window.location = "expense.html";
    } 
    else
    {
        $(document).ready(function() {
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/get_expense_details_data',
                method: 'POST',
                data: {'expense_id': expense_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var response =JSON.parse(response);
                    if(response.status==1)
                    {
                        expense_data     = response.expense_data;
                        let expense_details  = response.expense_details;
                        let supporting_doc   = response.supporting_doc;

                        if(expense_details.length > 0)
                        {
                            let sl_no = 1;
                            expense_details.forEach(function(each_expense, index) {
                                if($(".sl_no").length>0)
                                {
                                    sl_no = Number($(".sl_no").length)+1;
                                }
                                let tRow = '<tr data-id="'+each_expense.id+'" class="item_row">\
                                    <td class="sl_no">'+sl_no+'</td>\
                                    <td class="expense_head">'+each_expense.acc_name1+'</td>\
                                    <td class="expense_description">'+each_expense.notes+'</td>\
                                    <td class="expense_amount">'+each_expense.amount+'</td>\
                                    <td class="expense_tax_amount">'+each_expense.tax_amount+'</td>\
                                    <td class="expense_total">'+each_expense.total+'</td>\
                                </tr>';
                                $('.expense_details_list tbody').append(tRow);
                            })
                        }

                        // console.log(supporting_doc);
                        let img_show_url = api_url.replace(client_identifier.toLowerCase(),'');
                        // console.log(img_show_url);
                        if(supporting_doc.length > 0)
                        {
                            supporting_doc.forEach(function(each_doc,index) {
                                $(".image_list_ul").append(`<li>
                                    <div class="imagelist_img">
                                        <img class="img" data-saved="1" data-id='`+each_doc.id+`' onclick="$('.img-modal').show();$('.image_modal_content').attr('src',$(this).attr('src'));">
                                        <img class="delete_img" src="images/delete_img.png" height="15px" width="15px" onclick="$('.image_list_ul li').removeClass('selected');$(this).parents('li').addClass('selected');delete_image('`+each_doc.doc_name+`',saved=1,id='`+each_doc.id+`');">
                                    </div>
                                </li>`);
                                $('.img').eq($(".imagelist_img").length - 1).attr('src', img_show_url+'userdatas/clients/'+client_identifier+'/attachments/expenses/'+each_doc.doc_name);
                                $('.img').eq($(".imagelist_img").length - 1).data('img_file_name',each_doc.doc_name);
                            })
                        }

                        if(expense_data.hold == 1)
                        {
                            $('.addBtn').show();
                            $('.saveBtn').show();
                            $('.reset').show();
                        }
                        else
                        {
                            $('.delete_img').hide();
                        }
                    }
                    else
                    {
                        $.alert(response.message);
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                    removeAjaxLoad();
                    $.alert('Expense Details cannot be fetched.Failed !');                        
                }   
            });
        })
    }



    </script>

    function calculateTax(taxes,pur_rate)
    {
        let product_total_tax = 0;
        let tax_less_amount   = Number(pur_rate);
        let tot_tax_amount    = 0;
        let with_tax_amount   = Number(pur_rate);
        if(taxes!=null && taxes!= undefined)
        {
            $.each(taxes,function(index,each_tax){
                let per = '%';
                let tax_rate = 0;
                let tax = 0;
                let tax_value = each_tax['tax_value'];
                if (tax_value != 0) {
                    tax_rate = tax_value.toString().split(per);
                    tax = Number(tax_rate[0]);
                }
                if (tax_rate.length > 0) {
                     product_total_tax += tax;
                }
                // console.log('tax_value - ' +each_tax['tax_value']);
            });
            console.log('tax_included - '+tax_included)
            if(product_total_tax > 0)
            {
                if (tax_included == 1) 
                {
                    console.log('I am here')
                    tot_tax_amount  = Number(pur_rate - (pur_rate/(product_total_tax+100))*100);
                    tax_less_amount = pur_rate-tot_tax_amount;
                    with_tax_amount = Number(pur_rate);
                }
                else
                {
                    console.log('No, I am here')
                    tot_tax_amount  = Number((product_total_tax/100)*pur_rate);
                    tax_less_amount = Number(pur_rate);
                    with_tax_amount = Number(pur_rate)+Number(tot_tax_amount);
                }
            }
        }
        else
        {
            tax_less_amount = Number(pur_rate);
            with_tax_amount = Number(pur_rate);
        }
        console.log('product_total_tax - '+product_total_tax)
        console.log('tot_tax_amount - '+tot_tax_amount)
        console.log('tax_less_amount - '+tax_less_amount)
        console.log('with_tax_amount - '+with_tax_amount)
        $('.prod_name').data('product_total_tax',product_total_tax);
        $('.prod_name').data('tot_tax_amount',tot_tax_amount);
        $('.prod_name').data('tax_less_amount',tax_less_amount);
        $('.prod_name').data('with_tax_amount',with_tax_amount);
    }

    api_url_arr.pop();
    let img_url = api_url_arr.join('/'); */
    $.ajax({
