<script>
$(document).ready(function() {
    $('.logout_btn').click(function(){
         window.localStorage.setItem('api_user_id','');
         window.location = "login.html";
    })
    $('.back_btn').click(function(){
        window.location = "home.html";
    })
    loadAjax();

    $.ajax({
        url: api_url+'/purchase_api/loadBranches',
        method: 'POST',
        data: {'api_user_id': api_user_id,'branch_id': window.localStorage.getItem('branch_id'),'client_identifier':client_identifier, 'type': 'closing_counter'},
        success: function(response) {
            removeAjaxLoad();
            var data =JSON.parse(response);
            if(data.pending_inventory>0)
            {
                //redirect to stock adjustment details page
                window.localStorage.setItem('counter_close_remittance_id',data.pending_inventory);
                window.localStorage.setItem('counter_close_remittance_update_id',data.pending_inventory);
                $('.startBtn').text('Update & Continew >');
                $.alert('Pending Transaction found. !<br>Please Complete This !<br><br><i>Please Note</i><br><b>Transaction date will change to today !</b>');
            }
            if(data.status==1)
            {
                let branches  = data.data;
                let destination_branches  = data.destination_branches;
                let collection_users      = data.collection_users;
                let prevent_depot_status = data.prevent_depot_status;
                let br_from_html  =  ``;
                if(branches.length > 0)
                {
                    branches.forEach(function(branch, index) {
                        if (prevent_depot_status == '1') {

                            if (branch.id == branch_id)
                                br_from_html +=  `<option value="${branch.id}">${branch.city}</option>`;
                        }else{
                            br_from_html +=  `<option value="${branch.id}">${branch.city}</option>`;
                        }
                    })

                }
                else
                {
                    br_from_html = '<option class="empty" value="0">No item found</option>';
                }
                let brHTML = '';
                if(destination_branches.length > 0)
                {
                    destination_branches.forEach(function(branch, index) {
                        brHTML += '<option class="item" data-id="'+branch.branch_id+'" value="'+branch.branch_id+'">'+branch.branch_code+'</option>';
                    })

                }
                else
                {
                    brHTML = '<option class="empty" value="0">Destination Branches Not Found !</option>';
                }

                let UserHTML = '<option value="0">No Collection/Direct Deposit</option>';
                if(collection_users.length > 0)
                {
                    collection_users.forEach(function(users, index) {
                        UserHTML += '<option class="item" data-id="'+users.id+'" value="'+users.id+'">'+users.name+'</option>';
                    })

                }
                else
                {
                    UserHTML = '<option class="empty" value="0">Collection Users Not Found !</option>';
                }

                $('.collection_users').html(UserHTML);
                $('.br_to').html(brHTML);
                $('.br_from').html(br_from_html);
            }
            else
            {
                 let brHTML = '<option class="empty" value="0">No item found</option>';
                 $('.branches').html(stockTypesList);
                 $.alert(data.message);
                 return false;
            }
        },
        error:function (xhr, ajaxOptions, thrownError){
                removeAjaxLoad();
                $.alert('No Branch found..!');
                return false;                          
            }   
    });
})

$(document).on('click','.vendors_list li.item',function(e){
    $('.vendors_list li.item').removeClass('active');
    $(this).addClass('active');
})
$(document).on('click','.startBtn',function(e){
    let br_from             = $('.br_from').val();
    let br_to               = $('.br_to').val();
    let collection_users    = $('.collection_users').val();
    let update_id = window.localStorage.getItem('counter_close_remittance_update_id')?window.localStorage.getItem('counter_close_remittance_update_id'):0;
    console.log('br_from', br_from)
    console.log('br_to', br_to)
    console.log('collection_users', collection_users)

    if((br_from!=null && br_from!='' && br_from!=0) && (br_to!=null && br_to!='' && br_to!=0))
    {
        $('.startBtn').attr('disabled', 'disabled');
        loadAjax();
        $.ajax({
                url: api_url+'/purchase_api/startCounterDepositDestinationProcess',
                method: 'POST',
                data: {'user_id':api_user_id,'branch_from': br_from,'branch_to': br_to,'collection_users': collection_users,'update_id': update_id,'currency_id': currency_id,'client_identifier':client_identifier},
                success: function(response) {
                    $('.startBtn').removeAttr("disabled");
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        window.localStorage.setItem('counter_close_remittance_update_id',0);
                        window.localStorage.setItem('counter_close_remittance_id',data.order_id);
                        window.localStorage.setItem('counter_close_branch_from',br_from);
                        window.localStorage.setItem('counter_close_branch_to',br_to);
                        window.location = "close_counter_collection_entry.html";
                    }
                    else
                    {
                        removeAjaxLoad();
                        window.localStorage.setItem('inventory_id','0');
                        $.alert(data.message);
                        return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $('.startBtn').removeAttr("disabled");
                        $.alert('Server error.Please Contact Aipsoft Support!');
                        return false;                          
                    }   
        });
        // window.localStorage.setItem('stockType_id',stockTypes_id);
        // window.location = "inventory.html";
    }
    else
    {
        $.alert('<b>Select mandatory !</b><br>Please select Closing Branch & Deposit Branch !');
    }
})
function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
    // $('.loading').removeClass('invisibl');
}
function removeAjaxLoad()
{
    $('.loading').remove();
    // setTimeout(function(){ $('.loading').remove();},100);
}
