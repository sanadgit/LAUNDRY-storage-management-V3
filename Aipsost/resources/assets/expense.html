$(document).ready(function() {

    //setting date and bill date to current date
    var date = new Date();
    var day = date.getDate();
    var month = date.getMonth() + 1;
    var year = date.getFullYear();
    if (month < 10) month = "0" + month;
    if (day < 10) day = "0" + day;
    var today = year + "-" + month + "-" + day;
    $('.date').val(today);
    $('.bill_date').val(today);

    loadAjax();
    $("select").select2();
    load_branches();
    // load_projects();
    load_pay_account();
    load_drivers();
    get_expense_data();
})

function load_branches()
{
    let br_HTML    =  '';
    $('.branch').html(br_HTML);     
    $.ajax({
        url: api_url+'/purchase_api/loadBranches',
        method: 'POST',
        async:false,
        data: {'api_user_id':api_user_id,'client_identifier':client_identifier},
        success: function(response) {
            var data =JSON.parse(response);
            // console.log(data);
            if(data.status==1)
            {
                let branches    =  data.data;
                if(branches.length > 0)
                {
                    branches.forEach(function(branch, index) {
                        br_HTML  += '<option class="item" value="'+branch.id+'">'+branch.city+'</option>';
                    })
                }
                $('.branch').html(br_HTML);
                load_vehicle_plate_no();
                load_vendors();
            }
        },
        error:function(xhr,ajaxOptions,thrownError){
            $.alert('Cannot Fetch Branch List.Failed!');                   
        }   
    });
}

$('body').on('change', '.branch', function(e) {
    loadAjax();
    $('.vendor').removeAttr('disabled');
    $('.driver').removeAttr('disabled');
    $('.vehicle_plate_number').removeAttr('disabled');
    $('.vehicle_owner').removeAttr('disabled');
    $('.projects').removeAttr('disabled');
    $('.driver').val("").trigger('change');
    load_vehicle_plate_no();

});

function load_vehicle_plate_no()
{
    let branch_id = $('.branch').val();
    $('.vehicle_plate_number').html('');
    $('.vehicle_owner').html('');
    $('.projects').html('');
    let asl_HTML  = '<option value = "" selected>Select Vehicle Plate No</option>';
    $.ajax({
        url: api_url+'/purchase_api/accountSegmentList',
        method: 'POST',
        async:false,
        data: {'branch_id':branch_id,'client_identifier':client_identifier},
        success: function(response) {
            var data =JSON.parse(response);
            // console.log(data);
            if(data.status==1)
            {
                let account_segment_list= data.data;
                if(account_segment_list.length > 0)
                {
                    account_segment_list.forEach(function(segment,index) {
                        asl_HTML += '<option class="item" value="'+segment.id+'">'+segment.segment_name+'</option>';
                    })
                }
                $('.vehicle_plate_number').html(asl_HTML);
            }
            else
            {
                $('.vehicle_plate_number').html(asl_HTML);
            }
            load_vehicle_owner_details();
            load_projects();
        },
        error:function (xhr, ajaxOptions, thrownError){
            $.alert('Cannot fetch Vehicle Plate No list.Failed!'); 
            $('.vehicle_plate_number').html(asl_HTML);                       
        }   
    });
}

function get_expense_data()
{
    if(expense_id !=0 && expense_id !=undefined && expense_id !=null && expense_id !='')
    {
        $.ajax({
            url: api_url+'/purchase_api/get_expense_data',
            method: 'POST',
            async:false,
            data: {'client_identifier':client_identifier,'expense_id':expense_id},
            success: function(response) {
                var response =JSON.parse(response);
                if(response.status = 1)
                {
                    expense_data = response.expense_data;
                    console.log(expense_data);
                    $(".branch").val(expense_data.branch_id).trigger('change');
                    $('.vendor').val(expense_data.party_account).trigger('change');
                    $('.driver').val(expense_data.driver_id).trigger('change');
                    $(".date").val(expense_data.date);
                    $('.vehicle_plate_number').val(expense_data.account_segment_id).trigger('change');
                    $('.vehicle_owner').val(expense_data.account_class_id).trigger('change');
                    $('.projects').val(expense_data.project_id).trigger('change');
                    $(".bill_date").val(expense_data.bill_date);
                    $('.bill_no').val(expense_data.bill_no);
                    $('.remark').val(expense_data.remark);
                    $('.pay_account').val(expense_data.pay_account);
                    $('.amount').val(expense_data.amount);
                
                    if(expense_data.hold == 1)
                    {
                        $('.startBtn').html("UPDATE");
                    }
                    else
                    {
                        $('.startBtn').html("VIEW");
                    }
                }
            }, 
            error:function (xhr, ajaxOptions, thrownError){
                $.alert('Cannot fetch Expense data. Failed!');              
            }   
        });
    }
    $('.startBtn').show();
}

$(document).on('click','.startBtn',function(e){
    if($('.startBtn').html() == "VIEW")
    {
        window.location = "expense_details.html";
        return false;
    }

    let branch  = $('.branch').val();
    if(!branch)
    {
        $.alert('Add Branch!');
        return false;
    }   

    let date = $('.date').val();
    if(!date)
    {
        $.alert('Add Date!');
        return false;
    }

    let vehicle_plate_number = $('.vehicle_plate_number').val();
    /* if(!vehicle_plate_number)
    {
        $.alert('Add Vehicle No!');
        return false;
    } */

    let vehicle_owner = $('.vehicle_owner').val();
    /* if(!vehicle_owner)
    {
        $.alert('Add Vehicle Owner!');
        return false;
    } */

    let bill_date = $('.bill_date').val();
    if(!bill_date)
    {
        $.alert('Add Bill Date!');
        return false;
    }

    let pay_account  = $('.pay_account').val();
    if(!pay_account)
    {
        $.alert('Add Pay Account!');
        return false;
    }

    
    let remark      =   $('.remark').val().trim();
    let bill_no     =   $('.bill_no').val().trim();
    let project_id  =   $('.projects').val();
    let vendor_id   =   $('.vendor').val();
    let driver_id   =   $('.driver').val();
    let amount      =   0;

    if(driver_id)
    {
        amount      = Number($('.amount').val());
        if(!amount)
        {
            $.alert('Add Amount!');
            return false;
        }
    }

    $('.startBtn').attr('disabled', 'disabled');
    loadAjax();
    $.ajax({
        url: api_url+'/purchase_api/hold_expense',
        method: 'POST',
        data: {'user_id':api_user_id, 'branch_id':branch, 'pay_account': pay_account,'date': date,'remark': remark,'client_identifier':client_identifier,'bill_date':bill_date,'bill_no':bill_no,'account_segment_id':vehicle_plate_number,'account_class_id':vehicle_owner,'project_id':project_id,'party_account':vendor_id,'driver_id':driver_id,'expense_id':expense_id,'amount':amount},
        success: function(response) {
            response=JSON.parse(response);
            removeAjaxLoad();
            if(response.status == 1)
            {
                window.localStorage.setItem('expense_id',response.expense_id);
                window.localStorage.setItem('account_segment_id',vehicle_plate_number);
                window.localStorage.setItem('account_class_id',vehicle_owner);
                window.localStorage.setItem('branch_id_expense',branch);
                window.location = "expense_details.html";
            }
            else
            {
                $.alert(response.message);
            }
            // console.log(response);
            // console.log(response.message);
        },
        error:function (xhr, ajaxOptions, thrownError){
            removeAjaxLoad();
            $('.startBtn').removeAttr("disabled");
            $.alert('Cannot add Expense.Failed !');                      
        }   
    });
})

function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
    // $('.loading').removeClass('invisibl');
}

function removeAjaxLoad()
{
    // $('.loading').remove();
    setTimeout(function(){ $('.loading').remove();},500);
}

$('.logout_btn').click(function(){
    window.localStorage.setItem('api_user_id','');
    window.location = "login.html";
})

$('.back_btn').click(function(){
    window.location = "expence_list.html";
})

$( document ).on( "ajaxStop", function() {
    removeAjaxLoad();
});

</script>
