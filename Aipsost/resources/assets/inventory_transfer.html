    <script type="text/javascript">
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let inventory_id        = window.localStorage.getItem('inventory_id');
    let stockType_id        = window.localStorage.getItem('stockType_id');
    let branch_id           = window.localStorage.getItem('branch_id');
    let currency_id         = window.localStorage.getItem('currency_id');
    let tax_included        = window.localStorage.getItem('tax_included');
    let branch_from        = window.localStorage.getItem('branch_from');
    let module_settings;
    let user_type;
    console.log('tax_included - '+tax_included)
    console.log('branch_from - '+branch_from)
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    } 
    // if(order_id=='' || order_id==null || order_id=='0') {
    //         window.location = "grn_supplier.html";
    // } 
    else{
        $(document).ready(function() {
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadInventoryData',
                method: 'POST',
                data: {'inventory_id': inventory_id,'branch_id':branch_id,'user_id':api_user_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    console.log(data);
                    user_type = data.user_type;
                    module_settings  = data.module_settings;
                    if(data.status==1)
                    {
                        let orderData  = data.data;
                        if(orderData.data_count > 0)
                        {
                            let orders = orderData.data_result;
                            let tot_qty = 0;
                            orders.forEach(function(order, index) {
                                let sl_no = 1;
                                if($(".sl_no").length>0)
                                {
                                    sl_no = Number($(".sl_no").length)+1;
                                }
                                let qty   = Number(order.quantity!=null?order.quantity:0);
                                tot_qty   = qty;
                                let tRow = '<tr class="item_row">\
                                                <td class="sl_no" data-barcode="'+order.barcode+'">'+sl_no+'</td>\
                                                <td>'+order.barcode+' - '+order.product_name1+'</td>\
                                                <td>'+order.unitname_short+'</td>\
                                                <td>'+Number(order.adjusted_rate).toFixed(2)+'</td>\
                                                <td>'+tot_qty+'</td>\
                                                <td>'+Number(order.net_amount).toFixed(2)+'</td>\
                                            </tr>';
                                $('.productList tbody').append(tRow);
                            })
                        }
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No Data found..!');
                        return false;                          
                    }   
            });
        })
    }



    </script>

<script>
    function mainSearchBarcode()
{
    let search_sale_products = new Bloodhound(
    {
        datumTokenizer: function(datum) {
          return Bloodhound.tokenizers.whitespace(datum.value);
        },
        queryTokenizer: Bloodhound.tokenizers.whitespace,
        remote: 
        {
            url: api_url+"/pos_api/getProductsUsingHints",
            prepare:function(query, settings)
            {
              $('.notify').remove();
              $(".spin_loader_cp").removeClass('hidden_section');
              $('.search_result').html('');
              settings.url = this.url + "/"+branch_id+'/'+client_identifier+'/'+query;
              return settings;
            },
            transform: function(response) 
            {
                  $(".spin_loader_cp").addClass('hidden_section');
                  $('.search_result').html('');
                  //console.log(response)
                  if(response != null && response.length > 0)
                  {
                      // $('.barcode_scan_field').parents('.label_style').find('.tt-menu').addClass('box_ul searchbox_arrow');
                      // return response;
                      let displayHtml = ``;
                      $.each(response,function(indx,item)
                      {
                          let price = Number(item.sale_rate_new?item.sale_rate_new:0).toFixed(2);
                          let prod_name = item.product_name1;
                          displayHtml += `<li class="ItemData item_${item.id}" data-id="${item.id}" data-barcode="${item.barcode}">${prod_name} ${item.packing_description?` - ${item.packing_description}`:``} <p style="margin-top:4px"> ${item.avail_units} (${item.avail_unit_eq_to_base} ${item.baseunit}) - ${item.barcode}</p></li>`;
                          
                      })
                      $('.search_result_ul').html(displayHtml);
                      $('.search_result_ul').find('li:first-child').addClass('selected');
                  }
                  else
                  {
                      $('.search_result_ul').html('<li> No items found!...</li>');
                      //$('.prod_search').removeData();
                      $('.prod_search').focus();
                  }
            }
        }
    });
    search_sale_prdt_ahead = $('.prod_search').typeahead(
    {
        hint: false,
        highlight: true,
        minLength: 1
    },
    {
        limit: 50,
        name: 'Search_sale_products',
        source: search_sale_products,
        display:function(data)
        {
            data.product_name
        },
        templates: 
        {
            suggestion: function(item) 
            {

    function calculateTax(taxes,pur_rate)
    {
        let product_total_tax = 0;
        let tax_less_amount   = Number(pur_rate);
        let tot_tax_amount    = 0;
        let with_tax_amount   = Number(pur_rate);
        if(taxes!=null && taxes!= undefined)
        {
            $.each(taxes,function(index,each_tax){
                let per = '%';
                let tax_rate = 0;
                let tax = 0;
                let tax_value = each_tax['tax_value'];
                if (tax_value != 0) {
                    tax_rate = tax_value.toString().split(per);
                    tax = Number(tax_rate[0]);
                }
                if (tax_rate.length > 0) {
                     product_total_tax += tax;
                }
                // console.log('tax_value - ' +each_tax['tax_value']);
            });
            console.log('tax_included - '+tax_included)
            if(product_total_tax > 0)
            {
                if (tax_included == 1) 
                {
                    console.log('I am here')
                    tot_tax_amount  = Number(pur_rate - (pur_rate/(product_total_tax+100))*100);
                    tax_less_amount = pur_rate-tot_tax_amount;
                    with_tax_amount = Number(pur_rate);
                }
                else
                {
                     console.log('No, I am here')
                    tot_tax_amount  = Number((product_total_tax/100)*pur_rate);
                    tax_less_amount = Number(pur_rate);
                    with_tax_amount = Number(pur_rate)+Number(tot_tax_amount);
                }
            }
        }
        else
        {
            tax_less_amount = Number(pur_rate);
            with_tax_amount = Number(pur_rate);
        }
        console.log('product_total_tax - '+product_total_tax)
        console.log('tot_tax_amount - '+tot_tax_amount)
        console.log('tax_less_amount - '+tax_less_amount)
        console.log('with_tax_amount - '+with_tax_amount)
        $('.prod_name').data('product_total_tax',product_total_tax);
        $('.prod_name').data('tot_tax_amount',tot_tax_amount);
        $('.prod_name').data('tax_less_amount',tax_less_amount);
        $('.prod_name').data('with_tax_amount',with_tax_amount);
    }

$(document).on('keypress keyup blur', 'input.numeric_only', function(evt) {
    var regex = new RegExp("^[0-9-+.]");
    let charCode = event.charCode ? event.which : event.charCode;
    var key = String.fromCharCode(charCode);
    if (!regex.test(key)) {
        event.preventDefault();
        return false;
    }
    else
    {
        let existing_value = $(this).val();
        if(charCode == 46)
        {
            if(existing_value.includes('.'))
            { 
                event.preventDefault();
                return false;
            }
        }
        else if(charCode == 45)
        {
            // if(existing_value.includes('-'))
            if(existing_value!='' && existing_value!='0')
            { 
                event.preventDefault();
                return false;
            }
        }
        else if(charCode == 43)
        {
            // if(existing_value.includes('+'))
            if(existing_value!=''  && existing_value!='0')
            { 
                event.preventDefault();
                return false;
            }
        }
    }
});

        let this_val = Number(($this.val()!=undefined) && ($this.val()!='+') && ($this.val()!='-') && ($this.val()!='.')?$this.val():0);
        // console.log('qty_avl - '+qty_avl);
        // console.log('this_val - '+this_val);
        if($('.updating').hasClass('qty_in_hand'))
        {
            let qty_diff    = this_val - qty_avl;
            // console.log('qty_diff inside QTH - '+qty_diff);
            let new_qty_hnd = qty_diff>0?'+'+qty_diff:qty_diff;
            // console.log('new_qty_hnd inside QTH - '+new_qty_hnd);
            $this.parents('.p_loopable').find('.qty_adjstd').val(new_qty_hnd);
        }
        if($('.updating').hasClass('qty_adjstd'))
        {
            let new_qty_hnd = qty_avl + this_val;
            // console.log('new_qty_hnd inside ADJ - '+new_qty_hnd);
            $this.parents('.p_loopable').find('.qty_in_hand').val(new_qty_hnd);
        }
    }
    // if($this.hasClass('update_fld_amt'))
    // {
        // $this.addClass('updating');
        let adj_amt = Number(($this.parents('.p_loopable').find('.adjsted_amount').val()!=undefined) && ($this.val()!='+') && ($this.val()!='-') && ($this.val()!='.')?$this.parents('.p_loopable').find('.adjsted_amount').val():0);
        let qty_adjstd  = Number($this.parents('.p_loopable').find('.qty_adjstd').val()!=undefined?$this.parents('.p_loopable').find('.qty_adjstd').val():0);
        // console.log('adj_amt inside NETAMNT - '+adj_amt);
        // console.log('qty_adjstd inside NETAMNT - '+qty_adjstd);
        let new_net_amt = adj_amt*qty_adjstd;
        new_net_amt = new_net_amt<0?new_net_amt*-1:new_net_amt;
         // console.log('new_net_amt inside NETAMNT - '+new_net_amt);
        $this.parents('.p_loopable').find('.net_amount').val(new_net_amt.toFixed(2))
    // }   
    setTimeout(function(){ $this.removeClass('updating'); },1000); 
}
$('body').on('keydown', '.p_loopable input.active_inp, .p_loopable select', function(e) {
    // console.log('pressed key inside here')
    let inp = $(this);
    if (e.which == 13  || e.keyCode == 13 || e.which == 9 || e.which == 39) {
      if (inp.hasClass('latest_row') && inp.parents('tr').hasClass('cartRow')) {
        addPrdRow(inp);
        return false;
       
      }
      else if(inp.is("select")){
            focusable = $('.p_loopable').find('input.active_inp,select').filter(':visible');
            next = focusable.eq(focusable.index(this)+1);
            next.focus().select();
            return false;
        
      }else{
        focusable = $('.p_loopable').find('input.active_inp,select').filter(':visible');
        next = focusable.eq(focusable.index(this)+1);
        if (next.length) {
            if(next.hasClass('select2-hidden-accessible')){
                 next.select2('open');
            }else if (next.hasClass('main_active_inp')) {
                // console.log("iam in");
                inp.focus().select();
            }
            else{
                next.focus().select();  
            }
             
        } else {
            $('.total_quantity').focus();
        }
        return false;
      }
        
    }else if (e.which == 37) { //left
          if (inp.hasClass('barcode')) {
            return false;
          }
          else if(inp.is("select")){
            
                focusable = $('.p_loopable').find('input.active_inp,select').filter(':visible');
                prev = focusable.eq(focusable.index(this)-1);
                prev.focus().select();
                return false;
            
          }else{
            focusable = $('.p_loopable').find('input.active_inp,select').filter(':visible');
            prev = focusable.eq(focusable.index(this)-1);
            // console.log(prev.length)
            if (prev.length) {
                prev.focus().select(); 
                 
            }
            return false;
          }
            
        }
      else if(e.which == 40 && ip.attr('type')=='text'){ //down
        // console.log('up')
        if(inp.closest('tr').next('tr').find('td').length > 0)
        {
            let className = '.'+inp.attr('class').split(' ').join('.');
            
            //$('.table tr').removeClass('focussed');
            //inp.closest('tr').next('tr').addClass('focussed');
            // console.log(inp.closest('tr').next('tr').find(className).attr('class'))
            inp.closest('tr').next('tr').find(className).focus();
            setTimeout(function(){inp.closest('tr').next('tr').find(className).select();},5)
            ;
        }
      }
      else if(e.which == 38  && inp.attr('type')=='text'){ //up
            // console.log(inp.closest('tr').prev('tr').find('td').length);
        if(inp.closest('tr').prev('tr').find('td').length > 0)
        {
            let className = '.'+inp.attr('class').split(' ').join('.');
            
            // console.log(inp.closest('tr').prev('tr').find(className).attr('class'))

            ;
        }
      }
      // else

});
