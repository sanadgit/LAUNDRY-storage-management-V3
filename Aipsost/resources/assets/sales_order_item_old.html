    <script type="text/javascript">
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let sales_order_id      = window.localStorage.getItem('sales_order_id');
    let customer_id         = window.localStorage.getItem('customer_id');
    let branch_id           = window.localStorage.getItem('branch_id');
    let currency_id         = window.localStorage.getItem('currency_id');
    let tax_included        = window.localStorage.getItem('tax_included');
    let module_settings; 
    let user_type;
    function RoundNum(num, length) { 
        let number = (Math.round( num * 100 ) / 100).toFixed(length);
        return number;
    }
    console.log('tax_included - '+tax_included)
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    } 
    if(sales_order_id=='' || sales_order_id==null || sales_order_id=='0') {
        alert(sales_order_id);
            window.location = "collection_customer.html";
    } 
    else{
        $(document).ready(function() {
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadSalesOrderData',
                method: 'POST',
                data: {'sales_order_id': sales_order_id,'branch_id':branch_id,'user_id':api_user_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    user_type        = data.user_type;
                    module_settings  = data.module_settings;
                    console.log(data);
                    if(data.status==1)
                    {
                        let orderData  = data.data;
                        if(orderData.data_count > 0)
                        {
                            let orders = orderData.data_result;
                            let tot_qty = 0;
                            orders.forEach(function(order, index) {
                                let sl_no = 1;
                                if($(".sl_no").length>0)
                                {
                                    sl_no = Number($(".sl_no").length)+1;
                                }
                                let details_id = order.details_id;
                                let pur_rate = order.purchase_rate?order.purchase_rate:0;
                                let stock = order.stock?order.stock:0;
                                let pack_desc = order.packing_description?order.packing_description:'';
                                let eq_to_base = order.eq_to_base?order.eq_to_base:0;
                                let net_amount = order.net_amount?order.net_amount:0;
                                let qty = order.qty?order.qty:0;
                                eq_to_base = RoundNum(eq_to_base, 2)
                                pur_rate = RoundNum(pur_rate, 2)
                                stock = RoundNum(stock, 2)
                                net_amount = RoundNum(net_amount, 2)
                                qty = RoundNum(qty, 2)
                                if (pack_desc != "")
                                    pack_desc = '- '+pack_desc;
                                let tRow = '<tr class="item_row" data-barcode="'+order.barcode+'" data-details_id="'+details_id+'" data-product_name="'+order.product_name+'" data-cat_name="'+order.category_name1+'" data-unit_name="'+order.unitname_short+'">\
                                        <td class="sl_no print_details" data-barcode="'+order.barcode+'">'+sl_no+'</td>\
                                        <td >'+order.barcode+' '+pack_desc+' <br/> '+order.product_name+' - '+order.unitname_short+' ('+eq_to_base+' '+order.baseunit+')</td>\
                                        <td class="rate_td">'+pur_rate+'</td>\
                                        <td class="qty_td">'+qty+'</td>\
                                        <td class="total_td">'+net_amount+'</td>\
                                    </tr>'; 

                                $('.productList tbody').append(tRow);
                            })
                        }
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No vendor found..!');
                        return false;                          
                    }   
            });
        })
    }

<script>
function mainSearchBarcode()
{
    let search_sale_products = new Bloodhound(
    {
        datumTokenizer: function(datum) {
          return Bloodhound.tokenizers.whitespace(datum.value);
        },
        queryTokenizer: Bloodhound.tokenizers.whitespace,
        remote: 
        {
            url: api_url+"/pos_api/getProductsUsingHints",
            prepare:function(query, settings)
            {
              $('.notify').remove();
              $(".spin_loader_cp").removeClass('hidden_section');
              $('.search_result').html('');
              settings.url = this.url + "/"+branch_id+'/'+client_identifier+'/'+query;
              return settings;
            },
            transform: function(response) 
            {
                  $(".spin_loader_cp").addClass('hidden_section');
                  $('.search_result').html('');
                  console.log(response)
                  if(response != null && response.length > 0)
                  {
                      // $('.barcode_scan_field').parents('.label_style').find('.tt-menu').addClass('box_ul searchbox_arrow');
                      // return response;
                      let displayHtml = ``;
                      $.each(response,function(indx,item)
                      {
                          let price = Number(item.sale_rate_new?item.sale_rate_new:0).toFixed(2);
                          let prod_name = item.product_name1;
                          displayHtml += `<li class="ItemData item_${item.id}" data-id="${item.id}" data-barcode="${item.barcode}">${prod_name} ${item.packing_description?` - ${item.packing_description}`:``} <p style="margin-top:4px"> ${item.avail_units} (${item.avail_unit_eq_to_base} ${item.baseunit}) - ${item.barcode}</p></li>`;
                          
                      })
                      $('.search_result_ul').html(displayHtml);
                      $('.search_result_ul').find('li:first-child').addClass('selected');
                  }
                  else
                  {
                      $('.search_result_ul').html('<li> No items found!...</li>');
                      //$('.prod_search').removeData();
                      $('.prod_search').focus();
                  }
            }
        }
    });
    search_sale_prdt_ahead = $('.prod_search').typeahead(
    {
        hint: false,
        highlight: true,
        minLength: 1
    },
    {
        limit: 50,
        name: 'Search_sale_products',
        source: search_sale_products,
        display:function(data)
        {
            data.product_name
        },
        templates: 
        {
            suggestion: function(item)

    function calculateTax(taxes,pur_rate)
    {
        let product_total_tax = 0;
        let tax_less_amount   = Number(pur_rate);
        let tot_tax_amount    = 0;
        let with_tax_amount   = Number(pur_rate);
        if(taxes!=null && taxes!= undefined)
        {
            $.each(taxes,function(index,each_tax){
                let per = '%';
                let tax_rate = 0;
                let tax = 0;
                let tax_value = each_tax['tax_value'];
                if (tax_value != 0) {
                    tax_rate = tax_value.toString().split(per);
                    tax = Number(tax_rate[0]);
                }
                if (tax_rate.length > 0) {
                     product_total_tax += tax;
                }
                // console.log('tax_value - ' +each_tax['tax_value']);
            });
            console.log('tax_included - '+tax_included)
            if(product_total_tax > 0)
            {
                if (tax_included == 1) 
                {
                    console.log('I am here')
                    tot_tax_amount  = Number(pur_rate - (pur_rate/(product_total_tax+100))*100);
                    tax_less_amount = pur_rate-tot_tax_amount;
                    with_tax_amount = Number(pur_rate);
                }
                else
                {
                     console.log('No, I am here')
                    tot_tax_amount  = Number((product_total_tax/100)*pur_rate);
                    tax_less_amount = Number(pur_rate);
                    with_tax_amount = Number(pur_rate)+Number(tot_tax_amount);
                }
            }
        }
        else
        {
            tax_less_amount = Number(pur_rate);
            with_tax_amount = Number(pur_rate);
        }
        console.log('product_total_tax - '+product_total_tax)
        console.log('tot_tax_amount - '+tot_tax_amount)
        console.log('tax_less_amount - '+tax_less_amount)
        console.log('with_tax_amount - '+with_tax_amount)
        $('.prod_name').data('product_total_tax',product_total_tax);
        $('.prod_name').data('tot_tax_amount',tot_tax_amount);
        $('.prod_name').data('tax_less_amount',tax_less_amount);

 function setDelayItem(str)
   {
    $('#barcode_get').val(str);
    $('#myBtn').click();
   }

function setRequestFocus()
   {

    setTimeout(function(){ $('#barcode_get').focus(); }, 300);
   }
    let screenHeight = Number($(window).outerHeight());
    let grn_table_height = screenHeight-190;
    $('.grn_table').css('height',grn_table_height+'px');
    $(document).on('click','.search_btn',function(e){
        $('.item_search').removeClass('hidden');
        $('.prod_search').focus()
    });
    $(document).on('click','.close_search_btn',function(e){
        let val = $('.prod_search').val();
        $('.item_search').addClass('hidden');
        $('.barcode_search').val(val)
        $('.barcode_search').focus()
    });
    $(document).on('click','.search_result_ul li',function(e){
        let barcode = $(this).attr('data-barcode')?$(this).attr('data-barcode'):0;
        $('.barcode_search').val(barcode);
        $('.OK_Btn').trigger('click')
        $('.item_search').addClass('hidden');
    });

    $(document).on('click','.productList tbody tr',function(e){

        let thisRow = $(this);
        $('.productList tbody tr').removeClass('selected')
        thisRow.addClass('selected')

        let barcode = thisRow.attr('data-barcode')?thisRow.attr('data-barcode'):'';

        $.ajax({
            url: api_url+'/purchase_api/loadProduct',
            method: 'POST',
            data: {'barcode': barcode,'branch_id':branch_id,'client_identifier':client_identifier},
            success: function(response) {
                removeAjaxLoad();
                $('.barcode_search').select()
                var data =JSON.parse(response);
                console.log(data);
                if(data.status==1)
                {
                    let productData  = data.data;
                    proceedToEdit(productData, thisRow)
                }
                else
                {
                    $('.prod_details').hide();
                     addProd_cls = '';
                    if(module_settings.add_product_from_mobile_application=='1' || user_type == 'Admin')
                    {
                        addProd_cls = 'hidden_item';
                    }
                    let divHtml = '<div class="form_footerBtn errorData">\
                                        <p class="errortxt">'+val+'</p>\
                                        <p class="errortxt">Product not found !!!</p>\
                                         <p class="errortxt '+addProd_cls+'">Create New</p>\
                                        <div class="buttonDiv">\
                                            <button type="button" class="addProd '+addProd_cls+'" data-id="'+val+'">ADD</button>\
                                        <div class="buttonDiv">\
                                            <button type="button" class="closeBtn">Close</button>\
                                        </div>\
                                    </div>';
                    $('.addProduct').html(divHtml).show();
                     // $.alert(data.message);
                     return false;
                }
            },
            error:function (xhr, ajaxOptions, thrownError){
                    removeAjaxLoad();
                    $.alert('No vendor found..!');
                    return false;                          
                }   
        });      

    })
function proceedToEdit(productData, thisRow)
    {
        if(productData.data_count > 0)
        {
            
            let details_id = thisRow.attr('data-details_id')?thisRow.attr('data-details_id'):'';
            let barcode = thisRow.attr('data-barcode')?thisRow.attr('data-barcode'):'';
            let qty = thisRow.find('.qty_td').html()?Number(thisRow.find('.qty_td').html()):0;
            let total_td = thisRow.find('.total_td').html()?Number(thisRow.find('.total_td').html()):0
            let purchase_rate = thisRow.find('.rate_td').html()?Number(thisRow.find('.rate_td').html()):0;


            let product       = productData.data_result;
            let assignedTax   = productData.assigned_tax;
            let eq_to_base    = Number(product[0].avail_unit_eq_to_base!=null?product[0].avail_unit_eq_to_base:1);
            let sale_price    = Number(product[0].sale_price!=null?product[0].sale_price:'0.00');

            let pack_desc    = product[0].packing_description!=null?product[0].packing_description:'';
            let avail_units    = product[0].avail_units!=null?product[0].avail_units:'';
            let baseunit    = product[0].baseunit!=null?product[0].baseunit:'';

            let retail_price_with_vat    = Number(product[0].retail_price_with_vat!=null?product[0].retail_price_with_vat:0);
            if (retail_price_with_vat != 0) {
                sale_price = retail_price_with_vat;
            }

            $('.prod_name').text(product[0].product_name); 
            $('.prod_name').data('unit',product[0].avail_units);
            $('.prod_name').data('eq_to_base',eq_to_base);
            $('.prod_name').data('unit_id',product[0].unit_id);
            $('.prod_name').data('prod_id',product[0].id);
            $('.prod_name').data('product_taxes',assignedTax);

            $('.prod_name').data('pack_desc',pack_desc);
            $('.prod_name').data('avail_units',avail_units);
            $('.prod_name').data('baseunit',baseunit);
            $('.prod_name').attr('data-barcode',barcode);
            $('.barcode_search').val(barcode);

            $('.cat_name').text(product[0].category_name);
            $('.eq_base_qty').text(eq_to_base);
            calculateTax(assignedTax,purchase_rate);
            // $('.purchase_rate').text(purchase_rate).hide(); 
            $('.prod_qty').val(qty); 
            $('.prod_foc').val(0); 
            $('.tot_qty').val(total_td); 
            $('.prod_total').val(purchase_rate.toFixed(2)); 
            $('.pur_rate').val(purchase_rate.toFixed(2)); 
            $('.s_rate').val(sale_price.toFixed(2));


            $('.delete_action').removeClass('hidden')
            $('.addBtn').attr('data-details_id', details_id)
            $('.addBtn').html('UPDATE')


            $('.prod_details').show();
            if(module_settings.edit_cost_non_admin_mobile=='1' || user_type == 'Admin')
            {
                $('.pur_rate').attr("readonly", false); 
            }
            if(module_settings.edit_sale_rate_non_admin_mobile=='1' || user_type == 'Admin')
            {
                $('.s_rate').attr("readonly", false); 
            }
            
            if(module_settings.focus_after_scaning_barcode=='purchase_rate' && !$('input.pur_rate').is('[readonly]'))
            {
                setTimeout(function(){$('.pur_rate').select()},300)
            }
            else if(module_settings.focus_after_scaning_barcode=='sale_rate' && !$('input.s_rate').is('[readonly]'))
            {
                setTimeout(function(){$('.s_rate').select()},300)
            }
            else if(module_settings.focus_after_scaning_barcode=='qty')
            {
                setTimeout(function(){$('.prod_qty').select()},300)
            }
            else
            {
                setTimeout(function(){$('.prod_foc').select()},300)
            }
        }
    }
 function deleteGRVRow(details_id){

            error:function (xhr, ajaxOptions, thrownError){

                }   
        });
 }
