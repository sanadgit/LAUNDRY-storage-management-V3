<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,100&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">

    <title>Drive Through Routing</title>
    
    <style type="text/css">
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling, make it act like an app */
            background-color: #f4f7f6;
        }
        
        /* Map Container Setup */
        .map_width_wrap {
            margin-top: 60px; /* Offset for navbar */
            height: calc(100vh - 60px); 
            width: 100%;
            position: relative;
        }      
        
        #map {
            width: 100%;
            height: 100%;
        }

        /* Navbar Customization */
        .bg_sky_blue { background-color: #4CC3FF !important; }
        .navbar-brand, .nav-link { color: white !important; }
        
        /* Floating Optimization Toggle */
        #opt-toggle-container {
            position: fixed;
            top: 75px;
            right: 15px;
            z-index: 1050;
        }
        .btn-opt-toggle {
            background-color: #343a40;
            color: #fff;
            border-radius: 30px;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        .btn-opt-toggle:hover { color: #4CC3FF; }

        /* Floating Action Info Panel overlaying the map */
        #route-info-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 990;
            width: 90%;
            max-width: 400px;
            font-family: 'Roboto', sans-serif;
            display: none; /* Hidden until route is calculated */
        }

        .route-info-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .route-stats {
            font-size: 14px;
            color: #333;
        }

        #toggle-list-btn {
            font-size: 22px;
            color: #4CC3FF;
            cursor: pointer;
            padding: 5px;
            background: #f0f9ff;
            border-radius: 8px;
            transition: 0.2s ease;
        }
        
        #toggle-list-btn:active { background: #d0edff; }

        /* List View Panel Overlay */
        #list-view-panel {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100vh - 60px);
            background: #f8f9fa;
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
            padding-top: 60px; /* Offset for toggle button */
            display: none; /* Hidden by default */
            font-family: 'Roboto', sans-serif;
        }

        .order-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            background: white;
        }
        .order-card.pickup { border-left: 5px solid #28a745; }
        .order-card.delivery { border-left: 5px solid #007bff; }
        
        .action-icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        /* Contact styling */
        .contact-link {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .contact-link:hover {
            text-decoration: none;
            color: inherit;
            opacity: 0.8;
        }
    </style>
  </head>
  <body class="home_delivery_body">

    <!-- Header Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg_sky_blue">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav mr-auto">
                   <li class="nav-item"><a class="nav-link" href="#">Delivery Dashboard</a></li>
                   <li class="nav-item active"><a class="nav-link" href="#">Home Delivery</a></li>
                   <li class="nav-item"><a class="nav-link" href="#">Pickup</a></li>
                </ul>
            </div>
            <a class="navbar-brand" href="#">Drive Through Live</a>
        </nav>
    </header>

    <!-- Floating Global Toggle Button (Visible on both Map and List) -->
    <div id="opt-toggle-container">
        <!-- Added event to parameter to stop click propagation -->
        <button class="btn btn-opt-toggle" onclick="toggleOptimizationMode(event)">
            <i class="fa fa-sliders"></i> Mode: <span id="opt-mode-text">Location</span>
        </button>
    </div>

    <!-- Map Section -->
    <section class="map_width_wrap">
        <div id="map"></div>
        
        <!-- Bottom Floating Bar -->
        <div id="route-info-panel">
            <div class="route-info-content">
                <div class="route-stats" id="distance-text">Calculating Route...</div>
                <i class="fa fa-bars" id="toggle-list-btn" onclick="toggleListView(true, event)"></i>
            </div>
        </div>
    </section>

    <!-- Full Screen List View Panel -->
    <div id="list-view-panel">
        <div class="d-flex align-items-center mb-3 pb-2 border-bottom">
            <button class="btn btn-sm btn-outline-info rounded-pill font-weight-bold" onclick="toggleListView(false, event)">
                <i class="fa fa-arrow-left"></i> Back to Map
            </button>
            <h5 class="mb-0 ml-3 font-weight-bold text-secondary">Route Stops</h5>
        </div>
        
        <div id="orders-list-container">
            <!-- List items will be injected here via JS -->
        </div>
    </div>

    <!-- Load Google Maps API (Replace YOUR_API_KEY with your actual key) -->
    <!-- Libraries included: places (optional but good for future), geometry -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC57nb4JOuptZ5RkhDqEtO9Qx81PmydGn8&callback=initMap"></script>

    <script type="text/javascript">
        let map;
        let directionsService;
        let directionsRenderer;
        let driverMarker;
        // Default location initialized so map logic doesn't crash if GPS is slow to load
        let lastKnownLocation = { lat: 25.2048, lng: 55.2708 }; 
        let routeCalculated = false;
        
        // Mode logic: 'location' (Shortest Path) or 'slot' (Time-window Priority)
        let optimizationMode = 'location'; 

        // =======================================================
        // 1. EXPANDED SAMPLE ARRAY WITH 10 ORDERS
        // =======================================================
        const ordersArray = [
            { id: "56", order_no: "P#-256", order_type: "pickup", customer: "Burger King", mobile: "0566644516", selected_slot: "", lat: 25.2048, lng: 55.2708 },
            { id: "1002", order_no: "ORD#-1002", order_type: "home_delivery", customer: "John Doe", mobile: "0566644514", selected_slot: "16:00 - 18:00", lat: 25.1972, lng: 55.2744 },
            { id: "1003", order_no: "ORD#-1003", order_type: "home_delivery", customer: "Sarah Smith", mobile: "0566644515", selected_slot: "20:00 - 22:00", lat: 25.1855, lng: 55.2644 },
            { id: "1004", order_no: "ORD#-1004", order_type: "home_delivery", customer: "Mike Johnson", mobile: "0566644517", selected_slot: "14:00 - 16:00", lat: 25.1742, lng: 55.2500 },
            { id: "57", order_no: "P#-257", order_type: "pickup", customer: "KFC", mobile: "0566644518", selected_slot: "", lat: 25.2100, lng: 55.2800 },
            { id: "1005", order_no: "ORD#-1005", order_type: "home_delivery", customer: "Emma Watson", mobile: "0566644519", selected_slot: "18:00 - 20:00", lat: 25.1600, lng: 55.2400 },
            { id: "1006", order_no: "ORD#-1006", order_type: "home_delivery", customer: "David Brown", mobile: "0566644520", selected_slot: "16:00 - 18:00", lat: 25.1500, lng: 55.2300 },
            { id: "58", order_no: "P#-258", order_type: "pickup", customer: "Pizza Hut", mobile: "0566644521", selected_slot: "", lat: 25.2200, lng: 55.2900 },
            { id: "1007", order_no: "ORD#-1007", order_type: "home_delivery", customer: "Chris Evans", mobile: "0566644522", selected_slot: "22:00 - 23:00", lat: 25.1400, lng: 55.2200 },
            { id: "1008", order_no: "ORD#-1008", order_type: "home_delivery", customer: "Anna Lee", mobile: "0566644523", selected_slot: "14:00 - 16:00", lat: 25.1900, lng: 55.2700 }
        ];

        // =======================================================
        // 2. LOGIC FUNCTIONS
        // =======================================================
        
        // Helper to convert "16:00 - 18:00" to sortable integer (1600). Empty goes to 0 (ASAP priority).
        function parseSlotTime(slotStr) {
            if (!slotStr) return 0; 
            let match = slotStr.match(/(\d+):(\d+)/);
            if (match) return parseInt(match[1]) * 100 + parseInt(match[2]);
            return 9999;
        }

        // Toggle between Map & List view
        function toggleListView(showList, e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation(); // Prevents click from hitting external scripts
            }
            document.getElementById('list-view-panel').style.display = showList ? 'block' : 'none';
        }

        // Toggle between Optimizaiton Modes
        function toggleOptimizationMode(e) {
            // Stop event bubbling to map
            if (e) {
                e.preventDefault();
                e.stopPropagation(); 
            }

            optimizationMode = optimizationMode === 'location' ? 'slot' : 'location';
            
            let btnText = optimizationMode === 'location' ? 'Location' : 'Time Slot';
            document.getElementById('opt-mode-text').innerText = btnText;
            
            // Recalculate route immediately using last known/default location
            if (lastKnownLocation) {
                calculateAndDisplayRoute(lastKnownLocation);
            }
        }

        // Helper to format Date into 12-hour AM/PM format
        function formatAMPM(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        // =======================================================
        // 3. INITIALIZE GOOGLE MAP
        // =======================================================
        function initMap() {
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                suppressMarkers: true, 
                polylineOptions: { strokeColor: '#4CC3FF', strokeWeight: 5, strokeOpacity: 0.8 }
            });

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: { lat: 25.2048, lng: 55.2708 },
                disableDefaultUI: true, 
                zoomControl: true
            });

            directionsRenderer.setMap(map);
            drawOrderMarkers();
            
            // Trigger calculation immediately with default location before GPS fires
            calculateAndDisplayRoute(lastKnownLocation);
            
            startLiveTracking();
        }

        function drawOrderMarkers() {
            ordersArray.forEach(order => {
                const iconUrl = order.order_type === 'pickup' 
                    ? 'http://maps.google.com/mapfiles/ms/icons/green-dot.png' 
                    : 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'; 
                    
                const marker = new google.maps.Marker({
                    position: { lat: order.lat, lng: order.lng },
                    map: map,
                    icon: iconUrl,
                    title: order.order_no
                });
                
                const redirectUrl = order.order_type === 'pickup' ? `pickup_request.html?pickup=${order.id}` : `home_delivery.html?del=${order.id}`;
                const driveUrl = `https://www.google.com/maps/dir/?api=1&destination=${order.lat},${order.lng}`;
                const displaySlot = order.selected_slot ? order.selected_slot : 'ASAP';

                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <div style="padding:10px; min-width: 210px; text-align: center; font-family: 'Roboto', sans-serif;">
                            <h6 style="margin:0 0 5px 0; color:#333; font-weight: bold;">${order.order_no}</h6>
                            <span style="font-size: 11px; color: gray; letter-spacing: 1px; text-transform: uppercase;">
                                ${order.order_type.replace('_', ' ')}
                            </span><br>
                            <span style="display:inline-block; margin-top:4px; font-size:12px; background:#ffc107; padding:2px 6px; border-radius:10px; font-weight:bold; color:#000;">
                                <i class="fa fa-clock-o"></i> ${displaySlot}
                            </span>
                            
                            <strong style="font-size: 15px; display: block; margin: 10px 0 2px 0;">${order.customer}</strong>
                            <div style="font-size: 13px; color: #555; margin-bottom: 12px;">${order.mobile}</div>
                            
                            <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
                                <a href="tel:${order.mobile}" class="btn btn-warning btn-sm" style="border-radius: 20px; font-weight: 500; padding: 4px 12px;">
                                    <i class="fa fa-phone"></i> Call
                                </a>
                                <a href="https://wa.me/${order.mobile}" target="_blank" class="btn btn-sm" style="background-color: #25D366; color: white; border-radius: 20px; font-weight: 500; padding: 4px 12px;">
                                    <i class="fa fa-whatsapp"></i> Chat
                                </a>
                                <button onclick="window.location.href='${redirectUrl}'" class="btn btn-info btn-sm" style="border-radius: 20px; font-weight: 500; padding: 4px 12px;">
                                    <i class="fa fa-eye"></i> View
                                </button>
                                <button onclick="window.open('${driveUrl}', '_blank')" class="btn btn-success btn-sm" style="border-radius: 20px; font-weight: 500; padding: 4px 12px;">
                                    <i class="fa fa-location-arrow"></i> Drive
                                </button>
                            </div>
                        </div>
                    `
                });
                
                marker.addListener('click', () => { infoWindow.open(map, marker); });
            });
        }

        // =======================================================
        // 4. LIVE DRIVER TRACKING
        // =======================================================
        function startLiveTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        lastKnownLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                        updateDriverMarker(lastKnownLocation);

                        if (!routeCalculated && ordersArray.length > 0) {
                            calculateAndDisplayRoute(lastKnownLocation);
                            routeCalculated = true;
                        }
                    },
                    (error) => { console.error("GPS Error:", error); },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            }
        }

        function updateDriverMarker(location) {
            if (!driverMarker) {
                driverMarker = new google.maps.Marker({
                    position: location, map: map,
                    icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 6, fillColor: "#ff3333", fillOpacity: 1, strokeWeight: 2, strokeColor: "#ffffff" },
                    title: "You are here"
                });
                map.setCenter(location);
                map.setZoom(12);
            } else {
                driverMarker.setPosition(location);
            }
        }

        // =======================================================
        // 5. CALCULATE ROUTE & GENERATE LIST VIEW
        // =======================================================
        function calculateAndDisplayRoute(driverLocation) {
            if (ordersArray.length === 0) return;

            // Clone array so we don't destroy original data
            let routingArray = [...ordersArray];

            // If Slot Optimization is on, pre-sort the array by time slot priority.
            if (optimizationMode === 'slot') {
                routingArray.sort((a, b) => parseSlotTime(a.selected_slot) - parseSlotTime(b.selected_slot));
            }

            const waypoints = [];
            const destinationOrder = routingArray[routingArray.length - 1];
            
            for (let i = 0; i < routingArray.length - 1; i++) {
                waypoints.push({ location: { lat: routingArray[i].lat, lng: routingArray[i].lng }, stopover: true });
            }

            // Google API Call
            directionsService.route(
                {
                    origin: driverLocation, 
                    destination: { lat: destinationOrder.lat, lng: destinationOrder.lng },
                    waypoints: waypoints,
                    // True = Let Google find shortest distance. False = strictly follow our Slot sorting array.
                    optimizeWaypoints: (optimizationMode === 'location'), 
                    travelMode: google.maps.TravelMode.DRIVING,
                    drivingOptions: {
                        departureTime: new Date(),  // Use live traffic logic for ETAs
                        trafficModel: 'bestguess'
                    }
                },
                (response, status) => {
                    if (status === "OK") {
                        directionsRenderer.setDirections(response);
                        const route = response.routes[0];
                        
                        // --- 1. Update Map Totals ---
                        let totalDistance = 0;
                        let totalDuration = 0;
                        
                        for (let i = 0; i < route.legs.length; i++) {
                            totalDistance += route.legs[i].distance.value;
                            totalDuration += route.legs[i].duration.value;
                        }

                        const distanceText = (totalDistance / 1000).toFixed(1) + " km";
                        const durationText = Math.ceil(totalDuration / 60) + " mins";
                        const totalStops = ordersArray.length;
                        
                        document.getElementById("route-info-panel").style.display = "block";
                        document.getElementById("distance-text").innerHTML = `<strong>Total:</strong> ${distanceText} • ${totalStops} stops • ${durationText}`;

                        // --- 2. Generate Optimized List View ---
                        let orderedStops = [];
                        
                        if (optimizationMode === 'location') {
                            // Map the original array to Google's reorganized path
                            const waypointOrder = route.waypoint_order;
                            for(let i = 0; i < waypointOrder.length; i++){
                                orderedStops.push(routingArray[waypointOrder[i]]);
                            }
                            orderedStops.push(destinationOrder);
                        } else {
                            // If slot mode, it strictly followed our array sort order
                            orderedStops = [...routingArray];
                        }

                        let listHTML = '';
                        let currentTimeMs = new Date().getTime(); // Start from right now
                        const serviceTimeMs = 5 * 60 * 1000; // 5 minutes service time per stop
                        
                        for (let i = 0; i < route.legs.length; i++) {
                            let leg = route.legs[i];
                            let stopInfo = orderedStops[i];
                            
                            // Add drive time for this specific leg
                            currentTimeMs += (leg.duration.value * 1000);
                            let expectedTimeStr = formatAMPM(new Date(currentTimeMs));
                            
                            let badgeClass = stopInfo.order_type === 'pickup' ? 'badge-success' : 'badge-primary';
                            let cardClass = stopInfo.order_type === 'pickup' ? 'pickup' : 'delivery';
                            let formattedType = stopInfo.order_type.replace('_', ' ').toUpperCase();
                            let displaySlot = stopInfo.selected_slot ? stopInfo.selected_slot : 'ASAP';

                            const redirectUrl = stopInfo.order_type === 'pickup' ? `pickup_request.html?pickup=${stopInfo.id}` : `home_delivery.html?del=${stopInfo.id}`;
                            const driveUrl = `https://www.google.com/maps/dir/?api=1&destination=${stopInfo.lat},${stopInfo.lng}`;

                            listHTML += `
                                <div class="card order-card ${cardClass} p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div>
                                            <h6 class="mb-1 font-weight-bold text-dark">${stopInfo.order_no}</h6>
                                            <span class="badge ${badgeClass} px-2 py-1">${formattedType}</span>
                                            <span class="badge badge-warning text-dark px-2 py-1 ml-1"><i class="fa fa-clock-o"></i> ${displaySlot}</span>
                                        </div>
                                        <div class="d-flex">
                                            <button class="btn btn-info action-icon-btn rounded-circle shadow-sm mr-2" title="View Order" onclick="window.location.href='${redirectUrl}'"><i class="fa fa-eye"></i></button>
                                            <button class="btn btn-success action-icon-btn rounded-circle shadow-sm" title="Drive" onclick="window.open('${driveUrl}', '_blank')"><i class="fa fa-location-arrow"></i></button>
                                        </div>
                                    </div>
                                    <div class="mb-3 text-secondary font-weight-bold" style="font-size: 15px;">
                                        <a href="tel:${stopInfo.mobile}" class="contact-link">
                                            <i class="fa fa-user mr-1 text-dark"></i> ${stopInfo.customer} - ${stopInfo.mobile} <i class="fa fa-phone text-success ml-1"></i>
                                        </a>
                                        <a href="https://wa.me/${stopInfo.mobile}" target="_blank" class="contact-link ml-3">
                                            <i class="fa fa-whatsapp" style="color: #25D366; font-size: 1.3em;"></i>
                                        </a>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded border">
                                        <small class="text-muted font-weight-bold"><i class="fa fa-car text-info"></i> ${leg.distance.text} • ${leg.duration.text}</small>
                                        <strong class="text-danger" style="font-size: 13px;"><i class="fa fa-clock-o"></i> Expected: ${expectedTimeStr}</strong>
                                    </div>
                                </div>
                            `;

                            // Add the 5 minutes it takes to complete the stop
                            currentTimeMs += serviceTimeMs;
                        }

                        document.getElementById("orders-list-container").innerHTML = listHTML;

                    } else {
                        console.error("Directions request failed due to " + status);
                    }
                }
            );
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
