<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">

    <title>Pickup Request</title>

  <body class="delivery_dashboard_body">
    <div class="warning">
      <p>Website only visible in Tablet & Mobile view</p>
    </div>

<section class="add_new_sale new_sale_page invoice_add_body">
    <header>


        <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg_navy_blue">
      
              <a href="/development/aipsoft-connect/delivery/pickup_request.html"><button class="close">
                  <img src="images/back.svg">
                  </button>
              </a>

              <a class="navbar-brand" href="#" style="margin-right: 50px;">Pickup Request <span class="invoice_number"></span></a>
              

        </nav>
    </header>
    <section class="sec_01 invoice_add_item">
        <div class="container">
          <div class="row row_wrapper_date_time">
            <div class="col-xs-6 col-sm-6 col-md-6 col_wrapper_left" style="margin-top: 7px;">
              <label>Slot Date</label>
                <input type="date" id="today_date" name="birthday" required>

              <label class="mt-2">Remarks</label>
              <textarea placeholder="Enter Remarks"></textarea>

            </div>
            <div class="col-xs-6 col-sm-6 col-md-6 col_wrapper_right">

                <label class="mt-2">Slot Time</label>
                <select id="time_picker" name="appt" class="form-control" required>
                    <option value="select_timeslot_value" style="color: #777; font-style: italic; font-size: 14px;">Select Slot Time</option>
                </select>

                <label class="mt-2">Remark Description</label>
                <textarea placeholder="Remark Description"></textarea>

            </div>
            <div class="locationurl">
                <label class="location_url" style="margin-left: -102px;">Location URL</label>
                <input type="text" placeholder="Enter location URL" style="width: 185%;border-radius: 7px;border-color: transparent; font-size: 14px;"></input>
            </div>
          </div>
      </div>
    </section>

    <section class="sec_02 invoice_list_sec02">
      <div class="container">
        <div id="selectedCustomerContainer"></div>
          <div class="row mt-3">
            <div class="col-xs-12 col-md-12 col-lg-12 col_wrapper">
                <a href="#" class="add_item_here_invoice">
                  <button type="button" data-toggle="modal" data-target="#chooseCustomerModal" id="chooseCustomerbtn"style="min-height: 50px;" >
                    Choose Customer
                  </button>
                </a>
            </div>
          </div>
    </section>
    <footer class="add_pickup">
            <ul class="submit_pickup">
              <li><button>Submit</button></li>
            </ul>
    </footer>
</section>



<!-- Modal -->
<div class="modal fade" id="chooseCustomerModal" tabindex="-1" role="dialog" aria-labelledby="chooseCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document" style="max-width: 106%;">
    <div class="modal-content" style="margin-left:-11px;">

      <div class="modal-header">
        <h5 class="modal-title" id="chooseCustomerModalLabel">Choose Customer</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body" style="max-height: 1000px; overflow-y: auto;">
        <div class="modal-inner-content">
          <!-- Put ALL your modal content here: header, form, containers etc. -->
          <section class="add_new_sale new_sale_page" style="margin-top: 36px;">
            <header>
              <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg_navy_blue">
                <a href="pickup_req.html">
                  <button class="close">
                    <img src="images/close.svg">
                  </button>
                </a>
                <a class="navbar-brand" href="#">Choose Customer</a>
              </nav>
            </header>

            <div class="container">
              <div class="row search_wrapper mb-4">
                <div class="col-xs-12 col-sm-12 col-md-12 col_wrapper">
                  <div class="input-group search-bar-sticky">
                    <input type="text" class="form-control choosecustsearch" placeholder="Choose Customer" aria-label="Input group example" aria-describedby="basic-addon1">
                    <span class="input-group-text" id="basic-addon1">
                      <img src="images/search.svg">
                    </span>
                  </div>
                </div>
              </div>
              <!-- You can append your search results here dynamically -->
            </div>
          </section>
        </div>
      </div>
    <div class="modal-footer" style="position: sticky; bottom: 0; background: #f8f9fa; border-top: 1px solid #dee2e6; padding: 10px 20px; z-index: 20; display: flex; justify-content: center;">
        <button type="button" class="btn btn-primary" id="addNewCustomerBtn">Add New Customer</button>
    </div>
    </div>
  </div>
</div>

<div class="modal fade" id="addNewCustomerModal" tabindex="-1" role="dialog" aria-labelledby="addNewCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document" style="max-width: 500px;">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addNewCustomerModalLabel">Add New Customer</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addCustomerForm">
          <div class="form-group">
            <label for="new_cust_mobile">Customer Mobile*</label>
            <input type="text" class="form-control" id="new_cust_mobile" name="new_cust_mobile" >
          </div>
          <div class="form-group">
            <label for="new_cust_name1">Customer Name*</label>
            <input type="text" class="form-control" id="new_cust_name1" name="new_cust_name1">
          </div>
          <div class="form-group">
            <label for="new_cust_addr">Customer Address</label>
            <textarea class="form-control" id="new_cust_addr" name="new_cust_addr"></textarea>
          </div>
          <!-- Add other fields here if needed like TRN, credit limit etc -->
          <button type="submit" class="btn btn-primary custmr_save_btn">Save Customer</button>
        </form>
        <div id="addCustomerMsg" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>
</div>

    <div class="modal fade" id="addNewShippingAddressModal" tabindex="-1" role="dialog" aria-labelledby="addNewShippingAddressLabel" aria-hidden="true">
      <div class="modal-dialog" role="document" style="max-width: 500px;">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addNewCustomerModalLabel">Add New Shipping Address</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
          </div>
          <div class="modal-body">
            <form id="addShippingAddressForm">
              <div class="form-group">
                <label for="new_cust_shipping_mobile">Customer Shipping Mobile*</label>
                <input type="text" class="form-control" id="new_cust_mobile" name="new_cust_mobile">
              </div>
              <div class="form-group">
                <label for="new_cust_shipping_name1">Customer Shipping Name*</label>
                <input type="text" class="form-control" id="new_cust_name1" name="new_cust_name1">
              </div>
              <div class="form-group">
                <label for="new_cust_shipping_addr">Customer Shipping Address</label>
                <textarea class="form-control" id="new_cust_addr" name="new_cust_addr"></textarea>
              </div>
              <!-- Add other fields here if needed like TRN, credit limit etc -->
              <button type="submit" class="btn btn-primary custmr_new_addr_save_btn">Save Address</button>
            </form>
            <div id="addCustomerMsg" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
    </div>
