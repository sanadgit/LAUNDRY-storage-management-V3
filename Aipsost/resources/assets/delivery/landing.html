    <script>
      // Check for toaster message on page load
      $(document).ready(function() {
        const toasterData = localStorage.getItem('delivery_order_toaster');
        if (toasterData) {
          try {
            const data = JSON.parse(toasterData);
            if (data.type && data.message) {
              if (typeof showToaster === 'function') {
                showToaster(data.type, data.message);
              } else if (typeof toastr !== 'undefined') {
                // Fallback if showToaster is not available
                toastr.options = {
                  "closeButton": true,
                  "newestOnTop": true,
                  "progressBar": true,
                  "positionClass": "toast-top-center"
                };
                if (data.type === 200 || data.type === 201) {
                  toastr.success('Success', data.message);
                } else if (data.type === 501) {
                  toastr.error('Error', data.message);
                } else if (data.type === 400) {
                  toastr.warning('Warning', data.message);
                } else {
                  toastr.info('Info', data.message);
                }
              }
              // Clear the toaster data after showing
              localStorage.removeItem('delivery_order_toaster');
            }
          } catch (e) {
            console.error('Error parsing toaster data:', e);
            localStorage.removeItem('delivery_order_toaster');
          }
        }
      });
    </script>
