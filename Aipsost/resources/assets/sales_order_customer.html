<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <!-- Meta, title, CSS, favicons, etc. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0 viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Aipsoft Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jquery-confirm.min.css">
    <script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
    <script src="js/jquery-confirm.min.js"></script>
    <script src="js/config.js"></script>
    <script type="text/javascript">
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    // let order_id            = window.localStorage.getItem('sale_order_id');
    let customer_id           = window.localStorage.getItem('customer_id');
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    } 
    let order_id     = window.localStorage.getItem('sale_order_id');
    if(order_id!=0 && order_id!=undefined && order_id!=null && order_id!='')
    {
        window.location = "sales_order_item.html";
    }

    if(customer_id!='' || customer_id!=null || customer_id!='0')
    {
        $(document).ready(function() {
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadCustomerData',
                method: 'POST',
                data: {'customer_id': customer_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    if(data.status==1)
                    {
                        let vendorData  = data.data;
                        let vendorsList = '';
                        if(vendorData.data_count > 0)
                        {
                            let vendors = vendorData.data_result;
                            vendorsList += '<p>'+vendors[0].acc_name1+'</p>';
                            vendorsList += '<p class="imp">'+vendors[0].city+'</p>';
                            vendorsList += '<p>'+vendors[0].address1+'</p>';
                            vendorsList += '<p>'+vendors[0].contact_person+'</p>';
                            vendorsList += '<p>'+vendors[0].mobile+'</p>';
                            vendorsList += '<p>'+vendors[0].other_details+'</p>';
                        }
                        else
                        {
                            vendorsList = '<p>No details found</p>';
                        }
                        $('.addressform').html(vendorsList);
                    }
                    else
                    {
                         let vendorsList = '<p>No details found</p>';
                         $('.addressform').html(vendorsList);
                         $.alert(data.message);
                         return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No vendor found..!');
                        return false;                          
                    }   
            });
        })
    }
    </script>
</head>

<style type="text/css">

    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
    }
    .nav_deader {
        background-image: linear-gradient(to right, #305daf , #17a9ca);
        /*background-image: linear-gradient(#252525, #070707);*/
        padding: 8px;
        color: #fff;
        overflow: hidden;
    }
    .aiplogo {
        float: left;
        margin-right: 8px;
    }
    .nav_text p {
        font-size: 14px;
        margin: 0;
        font-weight: 400;
        margin-top: 2px;
    }
    .sales_order_wrap{
        padding: 8px 10px;
        overflow: hidden;
    }
    .back_btn{
        background-color: #2350a3;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
        border: 0;
        padding: 8px 30px;
        float: left;
        border-radius: 4px;
        letter-spacing: 1px;
    }
    .footer button{
        width: 100%;
        padding: 15px;
        font-weight: 600;
        font-size: 16px;
        background-color: #2451a6;
        color: #fff;
        position: fixed;
        bottom: 0px;
        border: 1px solid #686f8c;
    }
    .addressform{
        width: 100%;
        overflow: hidden;
    }
    .addressform p{
        color: #2f2f2f;
        font-size: 14px; 
        font-weight: 400;
        margin-bottom: 8px;

    }
    .imp{
        color: #bd201b !important;
    }
    .loading {
        position: fixed;
        z-index: 999999;
        height: 100%;
        width: 100%;
        overflow: show;
        margin: auto;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: #000;
        opacity: 0.5;
    }
    img.loadingIco {
        width: 100%;
        position: absolute;
        top: 25%;
    }
    .form-row {
        padding: 15px 0;
        border-top: #040404 1px solid;
    }
    .form-row input{
        padding: 10px;
    }
    .form-row label{
        font-size: 14px;
    }

    /* CSS specific to iOS devices */ 

    @supports (-webkit-touch-callout: none) {
    .nav_deader {
        padding-top: 50px;
    }
    .sales_order_wrap {
        height:    calc(100vh - 90px);
    } 
    }

    
</style>

<body>

    <div class="nav_deader">
        <div class="aiplogo">
            <img src="images/aipsoft.png">
        </div>
        <div class="nav_text">
            <p>AipSoft - Sales Order - Customer</p>
        </div>
    </div>

    <div class="sales_order_wrap">  
        <div class="content">
            <button type="button" class="back_btn">Back</button>
        </div>
        <div class="addressform">
            <!-- <p>Supplier Name</p>
            <p class="imp">City Name</p>
            <p>Address</p>
            <p>Contact Name</p>
            <p>Other Details</p>
            <p>Other Details</p>
            <p>Other Details</p> -->
        </div>
        <div class="form-row">
            <label>Remarks</label>:
            <input type="text" class="remarks" name="remarks" value="">
        </div>    
    </div>
    <div class="footer">
        <button type="button" class="startBtn">Save & Start ></button>        
    </div>
<script type="text/javascript">
$(document).ready(function(){
    $('.back_btn').click(function(){
        window.localStorage.setItem('customer_id','0');
        window.location = "sales_order.html";
    })
    setTimeout(function(){$('.remarks').select()},100)
})  
$(document).on('keyup','.remarks',function(e){
    let val = $(this).val();
    if((e.which == 13  || e.keyCode == 13))
    {
        $('.startBtn').click()
    }
})  
$(document).on('click','.startBtn',function(e){
    let branch_id             = window.localStorage.getItem('branch_id');
    let currency_id           = window.localStorage.getItem('currency_id');
    let remarks                = $('.remarks').val()?$('.remarks').val():0;
    if(customer_id!=null && customer_id!='' && customer_id!=0)
    {
        $('.startBtn').attr('disabled', 'disabled');
        loadAjax();
        $.ajax({
                url: api_url+'/purchase_api/startSaleOrderProcess',
                method: 'POST',
                data: {'user_id':api_user_id,'customer_id':customer_id,'branch_id': branch_id,'remarks':remarks,'currency_id': currency_id,'client_identifier':client_identifier},
                success: function(response) {
                    $('.startBtn').removeAttr("disabled");
                    var data =JSON.parse(response);
                    if(data.status==1)
                    {
                        window.localStorage.setItem('sale_order_id',data.order_id);
                        window.localStorage.setItem('customer_id',customer_id);
                        window.location = "sales_order_item.html";
                    }
                    else
                    {
                        removeAjaxLoad();
                        window.localStorage.setItem('sale_order_id','0');
                        $.alert(data.message);
                        return false;
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $('.startBtn').removeAttr("disabled");
                        $.alert('Server error.Please Contact Aipsoft Support!');
                        return false;                          
                    }   
        });
    }
})
function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
}
function removeAjaxLoad()
{
    $('.loading').remove();
}
</script>
</body>

</html>
