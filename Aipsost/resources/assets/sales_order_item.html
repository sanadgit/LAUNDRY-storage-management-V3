    <script type="text/javascript"> 
    
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let order_id            = window.localStorage.getItem('sale_order_id');
    let customer_id         = window.localStorage.getItem('customer_id');
    let branch_id           = window.localStorage.getItem('branch_id');
    let currency_id         = window.localStorage.getItem('currency_id');
    let tax_included        = window.localStorage.getItem('tax_included');
    let module_settings;
    let user_type;
    var note_icon = '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" style="color: #007bff;" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16"> <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/></svg>';   
                 
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    } 
    if(order_id=='' || order_id==null || order_id=='0') {
            window.location = "sales_order_customer.html";
    } 
    else{
        $(document).ready(function() {

                         
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadSalesOrderData',
                method: 'POST',
                data: {'order_id': order_id,'branch_id':branch_id,'user_id':api_user_id,'client_identifier':client_identifier},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    user_type        = data.user_type;
                    module_settings  = data.module_settings;
                    if(data.status==1)
                    {
                        let orderData  = data.data;
                        if(orderData.data_count > 0)
                        {
                            let orders = orderData.data_result;
                            let product_id = orderData.product_id;
                            orders.forEach(function(order, index) { 
                                let sl_no = 1;
                                if($(".sl_no").length>0)
                                {
                                    sl_no = Number($(".sl_no").length)+1;       
                                }
                                let qty   = Number(order.qty!=null?order.qty:0);
                         
                                let tRow = '<tr class="item_row" data-details_id="'+order.id+'" data-product_name="'+order.product_name1+'"  data-product_id="'+order.product_id+'" data-unit_name="'+order.unitname_short+'" data-cat_name="'+order.category_name1+'" data-eq_to_base="'+order.eq_to_base+'" data-curr_stock="'+order.stock+'">\
                                                <td class="sl_no" data-barcode="'+order.barcode+'">'+sl_no+'</td>\
                                                <td>'+order.product_model+' - '+order.product_name1+'</td>\
                                                <td>'+order.unitname_short+'</td>\
                                                <td class="rate_td">'+Number(order.unit_price).toFixed(2)+'</td>\
                                                <td class="qty_td">'+qty+'</td>\
                                                <td class="tax_td">'+Number(order.tax_amount).toFixed(2)+'</td>\
                                                <td class="amt_td">'+Number(order.net_amount).toFixed(2)+'</td>\
                                                <td class="item_note" style="text-align: center">'+note_icon+ '<input type="hidden" class="old_item_note" value="'+order.item_note+'">' +'</td>\
                                            </tr>';
                                $('.productList tbody').append(tRow);
                                $('.productList tfoot').html('<tr><td colspan="6" style="padding: 15px; text-align: right; border: none">Total Net Amount: </td><td style="border: none; font-weight: bold;" id="total_net_amt">'+ Number(order.total_net_amount).toFixed(2)+'</td></tr>');
                            })
                        }
                    } 
                    
                    if(module_settings.edit_sale_rate_non_admin_mobile=='1' || user_type == 'Admin' || user_type == 'Super Admin')
                    {
                        $('.rate').attr("readonly", false); 
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No Sales Order found..!');
                        return false;                          
                    }   
            });
        })
    }

    function loadProductData(val, mode){
        if(val!='')
        {
            
            $('.addProduct').html('').hide();
            loadAjax()
            $.ajax({
            url: api_url+'/purchase_api/loadProduct',
            method: 'POST',
            async: false,
            data: {'barcode': val, 'branch_id':branch_id, 'client_identifier':client_identifier},
            success: function(response) {
                removeAjaxLoad();
                $('.barcode_search').select()
                var data =JSON.parse(response);
                if(data.status==1)
                {
                    let productData  = data.data;
                    let duplicate_flag = 0;
                    if(mode === 'insert'){
                        $(".item_row").each(function(){
                            if($(this).find('.sl_no').data('barcode')==val)
                            {
                                duplicate_flag=1;
                                return false;
                            }                            
                        });
                        if(duplicate_flag==1)
                        {

                                title:'Confirmation!',
                                content: 'This product already added, Are you sure to add again?',

                                    Okay: function () {
                                        proceedToAdd(productData);
                                    },
                                    Cancel: function () {
                                        $('.closeBtn').click();    
                                    }
                                },
                                onOpen: function () {
                                // after the modal is displayed.
                                    
                                },

                            });
                        }
                        else
                        {
                            proceedToAdd(productData)
                        }

                        proceedToAdd(productData, 'edit')
                    }

                        return false;
                }
            },

                removeAjaxLoad();
                $.alert('No customer found..!');
                return false;                          
            }   
        });
        }

            } 
            $('.prod_foc').val(0); 
            $('.tot_amt').val(total_amt.toFixed(2));

            }
            else
            {
                setTimeout(function(){$('.prod_foc').select()},300)
            }
            stockIndication();
        }

    function calculateTax(taxes,base_unit)
    {
        let product_total_tax = 0;
        let tax_less_amount   = Number(base_unit);
        let tot_tax_amount    = 0;
        let with_tax_amount   = Number(base_unit);
        if(taxes!=null && taxes!= undefined)
        {
            $.each(taxes,function(index,each_tax){
                let per = '%';
                let tax_rate = 0;
                let tax = 0;
                let tax_value = each_tax['tax_value'];
                if (tax_value != 0) {
                    tax_rate = tax_value.toString().split(per);
                    tax = Number(tax_rate[0]);
                }
                if (tax_rate.length > 0) {
                     product_total_tax += tax;
                }
            });
            if(product_total_tax > 0)
            {
                if (tax_included == 1) 
                {
                    tot_tax_amount  = Number(base_unit - (base_unit/(product_total_tax+100))*100);
                    tax_less_amount = base_unit-tot_tax_amount;
                    with_tax_amount = Number(base_unit);
                }
                else
                {
                    tot_tax_amount  = Number((product_total_tax/100)*base_unit);
                    tax_less_amount = Number(base_unit);
                    with_tax_amount = Number(base_unit)+Number(tot_tax_amount);
                }
            }
        }
        else
        {
            tax_less_amount = Number(base_unit);
            with_tax_amount = Number(base_unit);
        }
        
        $('.prod_name').data('product_total_tax',product_total_tax);
        $('.prod_name').data('tot_tax_amount',tot_tax_amount);
        $('.prod_name').data('tax_less_amount',tax_less_amount);
        $('.prod_name').data('with_tax_amount',with_tax_amount);

    }
