<script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
<script src="js/jquery-confirm.min.js"></script>
<script>

function save_msg()
{
     $.confirm({
            title:'Saved & Completed !',
            content: 'Data saved successfully !',
            buttons: {
                Okay: function () {
                        loadAjax()
                       window.location = "close_counter_start.html"; 
                },
                Cancel: function () {
                        
                }
            },
            onOpen: function () {
            // after the modal is displayed.
               
            },

        });
}

$(document).ready(function() {
    $('.upload_img').click(function(){
        $(".file-input").trigger('click');
    });
    var formData = '';
    $('.reset').click(function(){
        // api_url = 'http://localhost/develop/freshfruitmart';
        $.confirm({
            title:'Confirmation!',
            content: 'Are you sure to remove all the uploaded images?',
            buttons: {
                Okay: function () {
                    let upload_api_link = api_url + '/purchase_api/DeleteImg';
                    let img_urls = [];
                    $(".img").each(function(){
                        img_urls.push($(this).data('img_file_name'));
                    });
                    
                    // console.log(img_urls);
                    // return false;
                    $.ajax({
                        url: upload_api_link,
                        type:'POST',
                        data:{'img_urls':img_urls,'client_identifier':client_identifier},
                        success:function(data){
                            $(".image_list_ul").empty();
                            formData = new FormData();
                        }

                    })
                },
                Cancel: function () {
                        
                }
            },
            onOpen: function () {
            // after the modal is displayed.
               
            },

        });
    });
    let image_upload = function()
    {
        loadAjax();
        let upload_api_link = api_url + '/purchase_api/UploadImg'
        let api_url_arr = api_url.split('/');
        api_url_arr.pop();
        let img_url = api_url_arr.join('/');
        $.ajax({
           url: upload_api_link,
           data: formData,
           contentType: false,
           processData: false,
           type: 'POST',
           dataType:'JSON',
           success: function(data)
           {
                if(data['img_sts'] == 0 || data['img_sts'] == '0')
                {
                    $(".image_list_ul").append(`<li>
                            <div class="imagelist_img">
                            <img class="img">
                            </div>
                        </li>`);
                    console.log(data);
                    console.log(api_url);
                    let img_show_url = api_url.replace(client_identifier.toLowerCase(),'');
                    $('.img').eq($(".imagelist_img").length - 1).attr('src', img_show_url+data['file_name_with_path']);
                    $('.img').eq($(".imagelist_img").length - 1).data('img_file_name',data['file_name']);
                    console.log($('.img').eq($(".imagelist_img").length - 1).data('img_file_name'));    
                }
                else
                {
                    $.alert('<b>Photo/Image Only Acceptable !</b><br>Please take photo with Camera Or Choose image from gallary');
                }
                removeAjaxLoad();
            // console.log(data);
           }
        });   
    }
    $("body").on('change','.file-input',function(){
        formData = new FormData();
        let imei_id = window.localStorage.getItem('imei_id');
        let that = this;
        let len  = $(".imagelist_img").length;
        console.log(len);
        formData.append('images',$('.file-input')[0].files[0]);
        formData.append('client_identifier',client_identifier);
        formData.append('imei_id',imei_id);
        let url   = this.value;
        let ext   = url.substring(url.lastIndexOf('.') + 1).toLowerCase();
        console.log(ext);
        var reader = new FileReader();
        reader.onload = function (e) {
            image_upload();
        }
        reader.readAsDataURL(this.files[0]);
    });   
    $('.logout_btn').click(function(){
         window.localStorage.setItem('api_user_id','');
         window.location = "login.html";
    })
    $('.back_btn').click(function(){
        
        let remittance_id = window.localStorage.getItem('counter_close_remittance_id');
         $.confirm({
            title:'Confirmation!',
            content: 'Are you sure to abort this transaction ?',
            buttons: {
                Okay: function () {
                        loadAjax()
                        $.ajax({
                                url: api_url+'/purchase_api/DeleteBranchRemittance',
                                method: 'POST',
                                data: {'remittance_id': remittance_id,'client_identifier':client_identifier},
                                success: function(response) {
                                    var data =JSON.parse(response);
                                    removeAjaxLoad();
                                    if(data.status == '1')
                                   window.location = "home.html"; 
                                    else
                                    $.alert('Somthing went wrong..!');  
                                    
                                    window.localStorage.setItem('counter_close_remittance_update_id','');
                                    window.localStorage.setItem('counter_close_remittance_id','');
                                    window.localStorage.setItem('counter_close_branch_from','');
                                    window.localStorage.setItem('counter_close_branch_to','');  

                                },
                                error:function (xhr, ajaxOptions, thrownError){
                                        removeAjaxLoad();
                                        $.alert('Somthing went wrong..!');
                                        return false;                          
                                    }   
                            });
                },
                Cancel: function () {
                        
                }
            },
            onOpen: function () {
            // after the modal is displayed.
               
            },

        });
    })
    loadAjax();

    let remittance_id = window.localStorage.getItem('counter_close_remittance_id');
    let branch_from   = window.localStorage.getItem('counter_close_branch_from');
    let branch_to   = window.localStorage.getItem('counter_close_branch_to');

    if(remittance_id == null || remittance_id == '' || branch_from == null || branch_from == '' || branch_to == null || branch_to == '')
    {
        window.location = "home.html";
    }

    let from_branch_id = window.localStorage.getItem('counter_close_branch_from');
    $.ajax({
        url: api_url+'/purchase_api/loadPaymentMethods',
        method: 'POST',
        data: {'from_branch_id': from_branch_id,'client_identifier':client_identifier, 'type': 'closing_counter'},
        success: function(response) {
            removeAjaxLoad();
            var data =JSON.parse(response);
            let payment_types = data.payment_types;
            let brHTML  =  ``;
            if(data.status==1)
            {
                if(payment_types.length > 0)
                {
                    payment_types.forEach(function(types, index) {
                        brHTML += `<div style="width:100%; margin-bottom:30px" class="itemForm">
                                        <label class="head_label">${types.name}</label><label class="head_balance">${types.name} Balance</label>
                                        <input class="payment_type_inputs" data-account_head_id="${types.linked_head_id}" type="number" name="">
                                        <input class="payment_current_balance" data-account_head_id="${types.linked_head_id}" type="text" disabled="disabled" value="${types.balance}" name="">
                                    </div>`;
                    })

                }
                else
                {
                    brHTML = '<h3>No Destination Branches Found !</h3>';
                }

            }
            else
            {
                 let brHTML = '<h3>No item found</h3>';
                 $.alert(data.message);
                 return false;
            }
            $('.payment_methods').html(brHTML);
        },
        error:function (xhr, ajaxOptions, thrownError){
                removeAjaxLoad();
                $.alert('No Branch found..!');
                return false;                          
            }   
    });
})

$(document).on('click','.vendors_list li.item',function(e){
    $('.vendors_list li.item').removeClass('active');
    $(this).addClass('active');
})
$(document).on('click','.startBtn',function(e){
    let continew_flag = true;
    let remittance_id = window.localStorage.getItem('counter_close_remittance_id');
    let branch_from   = window.localStorage.getItem('counter_close_branch_from');
    let branch_to   = window.localStorage.getItem('counter_close_branch_to');

     let img_urls = [];
        $(".img").each(function(){
            img_urls.push($(this).data('img_file_name'));
        });

    let account_heads = [];
    $(".payment_type_inputs").each(function() {
        let ac = {};
       ac['payment_method'] = $(this).prev().prev().text();
       ac['ac_head_id'] = $(this).data('account_head_id');
       ac['amount'] = $(this).val();
       ac['balance'] = $(this).next().val();
       if(ac['amount'] == null || ac['amount'] == '' || ac['amount'] == ' ')
       {
        $.alert('Please fill all the fileds !<br>'+ac['payment_method']+' is: '+ac['amount']);
        return false;
        continew_flag = false;
       }
       
       if(Number(ac['amount']) > Number(ac['balance']) && Number(ac['balance']) > 0)
       {
        $.alert('Amount larger than balance<br>'+ac['payment_method']+' is: '+ac['amount']+'<br><br><i>Please check your all sales data is syncronzied to the server or check the amount !</i>');
        continew_flag = false;
       }
       account_heads.push(ac);
    });
   
    if((remittance_id!=null && remittance_id!='' && remittance_id!=0) && (branch_from!=null && branch_from!='' && branch_from!=0) && (branch_to!=null && branch_to!='' && branch_to!=0))
    {
        if(continew_flag)
        {
             $('.startBtn').attr('disabled', 'disabled');
                loadAjax();
                $.ajax({
                        url: api_url+'/purchase_api/CompleteCounterDepositDestinationProcess',
                        method: 'POST',
                        data: {'user_id':api_user_id,'remittance_id':remittance_id,'branch_from': branch_from,'branch_to': branch_to,'account_heads': account_heads,'currency_id': currency_id,'images':img_urls, 'client_identifier':client_identifier},
                        success: function(response) {
                            $('.startBtn').removeAttr("disabled");
                            var data =JSON.parse(response);
                            console.log(data);
                            if(data.status==1)
                            {
                                window.localStorage.setItem('counter_close_remittance_id','');
                                window.localStorage.setItem('counter_close_branch_from','');
                                window.localStorage.setItem('counter_close_branch_to','');
                                $('.payment_methods').html('');
                                $(".image_list_ul").empty();
                                save_msg();
                                
                            }
                            else
                            {
                                removeAjaxLoad();
                                $.alert(data.message);
                                return false;
                            }
                        },
                        error:function (xhr, ajaxOptions, thrownError){
                                removeAjaxLoad();
                                $('.startBtn').removeAttr("disabled");
                                $.alert('Server error.Please Contact Aipsoft Support!');
                                return false;                          
                            }   
                });
        }
        // window.localStorage.setItem('stockType_id',stockTypes_id);
        // window.location = "inventory.html";
    }
    else
    {
        $.alert('Check all fields !');
    }
})
function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
    // $('.loading').removeClass('invisibl');
}
function removeAjaxLoad()
{
    $('.loading').remove();
    // setTimeout(function(){ $('.loading').remove();},100);
}
</script>
</body>
