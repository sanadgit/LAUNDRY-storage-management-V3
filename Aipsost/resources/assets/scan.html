<script>

let getUrlParameter = function getUrlParameter(sParam) {
    let url = $('.url_path').val()?$('.url_path').val():'';
    let sPageURL = "";
    let splitUrl = url.split("?")
    if (splitUrl.length > 1) {
      sPageURL = splitUrl[1];
    } 
    //console.log({sPageURL});
    if (sPageURL != "") {
         let sURLVariables = sPageURL.split('&'),
            sParameterName,
            i;

        for (i = 0; i < sURLVariables.length; i++) {
            sParameterName = sURLVariables[i].split('=');
            //console.log({sParameterName});
            if (sParameterName[0] === sParam) {
                return typeof sParameterName[1] === undefined ? true : decodeURIComponent(sParameterName[1]);
            }
        }
    }

    
    return 0;
};


function submit_url_data() {
    let urlRetrive = getUrlParameter('retrive');
        let urlId = getUrlParameter('id');

        console.log({urlRetrive, urlId})

        if (urlRetrive == 0 || urlId == 0) {

          $.alert({
                   title: 'Error',
                    content: 'Invalid value !',
                    onContentReady: function () {
                    setTimeout(function(){$(".jconfirm-buttons").find('button').focus();},100);
                    },
                     onClose: function () { $('.url_path').focus()}
            });
            return false;
        }
        window.location = "retrive_convert.html?retrive="+urlRetrive+"&id="+urlId;
}

    $('.startBtn').click(function(){

})


 function setDelayItem(str)
