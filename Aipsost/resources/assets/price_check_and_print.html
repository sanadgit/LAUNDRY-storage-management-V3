    <!-- Global Styling & Dynamic JS Injections Styling -->
    <style type="text/css">
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #050514;
            margin: 0;
            overflow: hidden; /* Prevent whole page scroll */
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            color: #ffffff;
        }
        
        /* Safe area handling for notched iOS devices */
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }

        .hidden { display: none !important; }

        /* Dim overlay for popups */
        .back_screen {
            background-color: rgba(5, 5, 20, 0.8);
            backdrop-filter: blur(4px);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 900;
            display: none;
        }

        /* Dynamic Table Styling (Updated to scroll internally) */
        .grn_table {
            height: 100% !important; /* Safely override JS inline height calculation */
            max-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            border-radius: 16px;
        }
        .grn_table::-webkit-scrollbar { display: none; }
        .productList {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .productList th {
            background-color: rgba(83, 52, 209, 0.15);
            color: #8E80FF;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }
        .productList td {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

        }
        .productList tr:last-child td { border-bottom: none; }
        .productList tr.item_row:active { background-color: rgba(255,255,255,0.05); }

        /* Loader Overlay Styling */
        .loading {
            position: fixed;
            z-index: 999999;
            height: 100%; width: 100%;

        img.loadingIco {
            width: 60px; 
            position: absolute;

        /* ----------------------------------------------------
           CSS Overrides for dynamically injected AddProduct Modal 
           ---------------------------------------------------- */

    <script type="text/javascript">
    let api_user_id         = window.localStorage.getItem('api_user_id');
    let api_url             = window.localStorage.getItem('api_url');
    let client_identifier   = window.localStorage.getItem('client_identifier');
    let branch_id           = window.localStorage.getItem('branch_id');
    let currency_id         = window.localStorage.getItem('currency_id');
    let tax_included        = window.localStorage.getItem('tax_included');
    let module_settings;
    let user_type;
    console.log('tax_included - '+tax_included)
    if((api_user_id == null || api_user_id == '' || api_url =='' || api_url == null)) {
            window.location = "login.html";
    }else{
        $(document).ready(function() { 
            loadAjax();
            $.ajax({
                url: api_url+'/purchase_api/loadlabelPrintData',
                method: 'POST',
                data: {'client_identifier':client_identifier, 'api_user_id':api_user_id, 'branch_id':branch_id},
                success: function(response) {
                    removeAjaxLoad();
                    var data =JSON.parse(response);
                    console.log(data);
                    if(data.status==1)
                    {
                        let orderData  = data.data;
                        user_type        = data.user_type;
                        module_settings  = data.module_settings;
                        if(orderData.data_count > 0)
                        {
                            
                            let orders = orderData.data_result;
                            let tot_qty = 0;
                            orders.forEach(function(order, index) {
                                let sl_no = 1;
                                if($(".sl_no").length>0)
                                {
                                    sl_no = Number($(".sl_no").length)+1;
                                }
                                let sale_rate = order.rsp_with_tax?order.rsp_with_tax:order.sale_price;
                                let tRow = '<tr class="item_row">\
                                        <td class="sl_no print_details" data-barcode="'+order.barcode+'">'+sl_no+'</td>\
                                        <td class="text-brand-light font-medium">'+order.barcode+'</td>\
                                        <td >'+order.product_name+'</td>\
                                        <td class="font-bold">'+order.qty+'</td>\
                                        <td class="text-emerald-400 font-bold">'+sale_rate+'</td>\
                                    </tr>';
                                $('.productList tbody').append(tRow);
                                $('.label_type').html(order.label_type);
                            })

                        }
                    }else if (data.status==3) {
                        module_settings  = data.module_settings;
                    }

                },
                error:function (xhr, ajaxOptions, thrownError){
                        removeAjaxLoad();
                        $.alert('No vendor found..!');
                        return false;                          
                    }   
            });
        })
    }
    </script>

<script>

function RoundNum(num, length) { 
    let number = (Math.round( num * 100 ) / 100).toFixed(length);
    return number;
}

    $(document).ready(function() {
        // UI Enhancements
        lucide.createIcons();
        $('#backBtn').click(function() {
            if (window.history.length > 1) { window.history.back(); } 
            else { window.location = "home.html"; }
        });

        // loadAjax()
        getDefaultBarcode();
        $('.barcode_search').focus(function(){
            $(this).select();
        })
        setTimeout(function(){$('.barcode_search').focus()},100);

        let print_type   = window.localStorage.getItem('print_type');
        if (print_type != '')
            $('.label_type').html(print_type);

    })
    let getDefaultBarcode = function()
    {
        $.ajax({
                url: api_url+'/purchase_api/default_barcode',
                method: 'POST',
                data: {'branch_id':branch_id,'client_identifier':client_identifier},
                success: function(response) {
                    var data =JSON.parse(response);
                    $('.OK_Btn').data('def_barcode','0');
                    if(data.status==1)
                    {
                        $('.OK_Btn').data('def_barcode',data.default_barcode.default_barcode)
                    }
                },
                error:function (xhr, ajaxOptions, thrownError){
                }   
            });
    }
    $(document).on('keyup','.barcode_search',function(e){
        let val = $(this).val();
        if(val!='' && (e.which == 13  || e.keyCode == 13))
        {
            $('.OK_Btn').click();
        }
    })
    $(document).on('keyup','.prod_qty',function(e){
        let val = $(this).val();
        if(val!='' && (e.which == 13  || e.keyCode == 13))
        {
            $('.addBtn').click();
        }
    })
    $(document).on('keyup','.pur_rate',function(e){
        let val = $(this).val();
        if(val!='' && (e.which == 13  || e.keyCode == 13))
        {
            $('.s_rate').select();
        }
    })
    $(document).on('keyup','.s_rate',function(e){
        let val = $(this).val();
        if(val!='' && (e.which == 13  || e.keyCode == 13))
        {
            $('.prod_qty').select();
        }
    })
    $(document).on('input','.pur_rate',function(e){
        let price   = Number($(this).val()?$(this).val():1);
        let qty     = Number($('.prod_qty').val());
        let tot     = qty*price;
        let assignedTax = $('.prod_name').data('product_taxes');
        calculateTax(assignedTax,price);
        $('.prod_total').val(tot.toFixed(2))
    })
    $(document).on('input','.prod_qty',function(e){
        let qty     = Number($(this).val()?$(this).val():1);
        let price   = Number($('.pur_rate').val());
        let tot     = qty*price;
        $('.prod_total').val(tot.toFixed(2))

            $('.cat_name').text(product[0].category_name);

            $('.tot_qty').val(1);

    function calculateTax(taxes,pur_rate)
    {
        let product_total_tax = 0;
        let tax_less_amount   = Number(pur_rate);
        let tot_tax_amount    = 0;
        let with_tax_amount   = Number(pur_rate);
        if(taxes!=null && taxes!= undefined)
        {
            $.each(taxes,function(index,each_tax){
                let per = '%';
                let tax_rate = 0;
                let tax = 0;
                let tax_value = each_tax['tax_value'];
                if (tax_value != 0) {
                    tax_rate = tax_value.toString().split(per);
                    tax = Number(tax_rate[0]);
                }
                if (tax_rate.length > 0) {
                     product_total_tax += tax;
                }
                // console.log('tax_value - ' +each_tax['tax_value']);
            });
            console.log('tax_included - '+tax_included)
            if(product_total_tax > 0)
            {
                if (tax_included == 1) 
                {
                    console.log('I am here')
                    tot_tax_amount  = Number(pur_rate - (pur_rate/(product_total_tax+100))*100);
                    tax_less_amount = pur_rate-tot_tax_amount;
                    with_tax_amount = Number(pur_rate);
                }
                else
                {
                     console.log('No, I am here')
                    tot_tax_amount  = Number((product_total_tax/100)*pur_rate);
                    tax_less_amount = Number(pur_rate);
                    with_tax_amount = Number(pur_rate)+Number(tot_tax_amount);
                }
            }
        }
        else
        {
            tax_less_amount = Number(pur_rate);
            with_tax_amount = Number(pur_rate);
        }
