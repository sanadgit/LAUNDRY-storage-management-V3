     // Add event listeners for both scroll and touchmove
    let isScrolling;
    $(window).on('scroll touchmove', function() {
        // Clear timeout to debounce
        clearTimeout(isScrolling);

        // Set a timeout to run after scroll event is completed
        isScrolling = setTimeout(function() {
            // Check if the user has scrolled to the bottom of the page
            if ($(window).scrollTop() + $(window).height() >= $(document).height() - 50) {
                // Call the load_dashboard_info function
                 window.location.reload();

                // Apply the translateY animation
                $('.dashboard_container').css({
                    transform: 'translateY(50px)', // Adjust the value for the desired effect
                    opacity: 1
                });
            }
        }, 200); // 200ms debounce time, adjust as needed
    });
    
})


function loadAjax()
{
    $('body').append("<div class='loading'><img src='images/new_loader.gif' class='loadingIco'></div>");
    // $('.loading').removeClass('invisibl');
}
function removeAjaxLoad()
{
    $('.loading').remove();
    // setTimeout(function(){ $('.loading').remove();},100);
}

function load_dashboard_info(request_data)
{
    let period = $('#period').val();

    $.ajax({
            url: api_url + '/purchase_api/LoadDashExpenceBoardInfo',
            method: 'POST',
            dataType: "json",
            data: {
                'request_data': request_data,
                'client_identifier': client_identifier,
                'branch_id': branch_id,
                'period': period,
                'user_id': api_user_id
            },
            success: function(response) {
                if(request_data == 'period_exp')
                {
                    $('.expence_active').text('AED '+response.data.expence_active);
                    $('.expence_total').text('AED '+response.data.expence_total);
                } else
                if (response.status === "1") {
                        
                    $('#period').empty();
        
                    // Get the months_selector object from the response
                    var monthsSelector = response.months_selector;
                    
                    // Loop through the monthsSelector and add each option to the select element
                    $.each(monthsSelector, function(key, value) {
                        $('#period').append('<option value="' + key + '">' + value + '</option>');
                    });    

                    $('.expence_active').text('AED '+response.data.expence_active);
                    $('.expence_total').text('AED '+response.data.expence_total);

                    $('.user_fullname').text(response.UserInfo.acc_name1);
                    $('.user_usertype').text('User Type: '+response.UserInfo.type);
                    $('.user_selected_achead').html('Selected Account Head:<br>'+response.UserInfo.selected_ac_head);

                    if (response.zoho_total && Object.keys(response.zoho_total).length > 0) {
                        $('#lastRefreshTime').text(response.zoho_total.curr_time);
                        $('.balance_amount').text('AED '+response.zoho_total.balance_total);
                        window.localStorage.setItem('lastRefreshTime',response.zoho_total.curr_time);
                        window.localStorage.setItem('balance_amount',response.zoho_total.balance_total);
                        
                    } else {
                        console.log("No Zoho Total data available.");
                        let lastRefreshTime = window.localStorage.getItem('lastRefreshTime');
                        let balance_amount = window.localStorage.getItem('balance_amount');
                        $('#lastRefreshTime').text(lastRefreshTime);
                        $('.balance_amount').text('AED '+balance_amount);
                    }

                        removeAjaxLoad();

                } else {
                    console.log("No data available");
                }
        
            },
            error: function(xhr, ajaxOptions, thrownError) {
                alert('Cannot fetch server data!');
                $('.column_list').css('display', 'block');
            }
        });
}

$('#period').on('change', function() {
    load_dashboard_info('period_exp')
});

function setCookie(name, value, minutes) {
    var date = new Date();
    date.setTime(date.getTime() + (minutes * 60 * 1000)); // Convert minutes to milliseconds
    var expires = "expires=" + date.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/";
}

function getCookie(name) {
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
        var cookie = cookies[i].trim();
        
        // Check if the cookie starts with the desired name
        if (cookie.indexOf(name + "=") === 0) {
            return cookie.substring((name + "=").length, cookie.length);
        }
    }
    return null; // Return null if the cookie is not found
}

function deleteCookie(name) {
    document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
}

let ask_for = getCookie('ask_for_rpt'); 
if(ask_for == '' || ask_for == null || ask_for == undefined)
{
    setCookie("ask_for_rpt", "dashboardinfo", 5);
    ask_for = 'zoho_Balance';

function call_refresh() {
    loadAjax();
    deleteCookie('ask_for_rpt');
    setTimeout(function() {

}
