<script>


$(document).ready(function() {
     $('.back_btn').click(function(){
        window.location = "home.html";
    })

    $('.settings').click(function(){
       let el = $(this);
       let settings = $(this).attr("data-settings")
       
       if(el.hasClass(settings))
       {
            window.localStorage.setItem(settings,el.val());
       }
       
    })

        
        var dataAttributes = {};

$(".settings").each(function (index, el) {
    if ( ! ($(el).data('settings') in dataAttributes) ) dataAttributes[$(el).data('settings')] = [];
    dataAttributes[$(el).data('settings')].push( $(el).find('settings').attr("data-settings") );
});

    $.each(dataAttributes, function(key, value) {
      let settings_key =  window.localStorage.getItem(key);
       if(settings_key != '' && settings_key != null)
       {
            console.log(settings_key);
            if(settings_key == 1)
                 $('.'+key+'.enable').attr('checked', 'checked');
             else
                 $('.'+key+'.disable').attr('checked', 'checked');
       }
       else
       {
            $('.'+key+'.enable').attr('checked', 'checked');
       }

    });

       

})


</script>
